  <style>
:root {
  --g900: #0a5a2e; --g700: #0f7b3f; --g600: #178a49; --g500: #1f9d55; --g200: #cfe9da; --g100: #e6f4ec; --g50: #f4fbf7;
  --text: #17261e; --muted: #66756c; --line: #dfe9e3; --bg: #f6f8f7; --card: #ffffff;
  --warn: #b26a00; --warn-bg: #fff4e0; --err: #b3261e;
  --shadow: 0 2px 10px rgba(15, 80, 45, .08);
}
/* Orange theme: same layout, different palette */
:root[data-theme="orange"] {
  --g900: #b33a00; --g700: #f4510b; --g600: #ff6a2a; --g500: #ff7a3d; --g200: #ffd2bd; --g100: #ffe9df; --g50: #fff6f1;
  --shadow: 0 2px 10px rgba(180, 60, 0, .10);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Nastaliq Urdu", "Noto Naskh Arabic", sans-serif;
  font-size: 16px; line-height: 1.7; min-height: 100vh;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; min-height: 48px;
}
input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--g500); box-shadow: 0 0 0 3px var(--g100); }
label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
.btn {
  border: 0; border-radius: 14px; padding: 10px 18px; min-height: 48px; background: var(--g700); color: #fff;
  font-weight: 700; cursor: pointer;
}
.btn:active { background: var(--g900); }
.btn.secondary { background: var(--g100); color: var(--g900); }
.btn.danger { background: #fdecea; color: var(--err); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.iconbtn {
  flex: none; width: 48px; height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff;
  font-size: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
}
.iconbtn.green { background: var(--g700); border-color: var(--g700); color: #fff; }

/* login */
#login { max-width: 420px; margin: 0 auto; padding: 56px 22px; }
#login h1 { color: var(--g900); text-align: center; font-size: 26px; }
.errtext { color: var(--err); font-size: 14px; margin-top: 10px; }

/* shell */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
header.top {
  background: linear-gradient(160deg, var(--g600), var(--g900)); color: #fff; padding: 12px 16px 16px;
  border-radius: 0 0 26px 26px; box-shadow: 0 4px 14px rgba(10, 90, 46, .25); position: relative; z-index: 2;
}
.hrow { display: flex; align-items: center; gap: 10px; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.avatar { overflow: hidden; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
.hinfo { flex: 1; min-width: 0; }
.hello { font-size: 13px; opacity: .85; line-height: 1.4; }
.shop { font-weight: 800; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.5; }
.chips { margin-top: 8px; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 12px; border-radius: 999px; font-size: 13px; background: rgba(255,255,255,.18); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6b6b; display: inline-block; }
.dot.on { background: #7dffa6; }
.chip.pend { background: #fff3cd; color: #6b4a00; }
.chip.fail { background: #fdecea; color: var(--err); }
.langbtn { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 10px; padding: 2px 12px; min-height: 36px; font-weight: 700; }
#syncnote { background: var(--g50); color: var(--muted); font-size: 12px; padding: 4px 16px; text-align: center; }
main { flex: 1; overflow-y: auto; padding: 14px 14px 24px; }

/* bottom nav with raised center button */
nav.bottom { display: flex; align-items: flex-end; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 14px rgba(0,0,0,.05); }
nav.bottom button { flex: 1; border: 0; background: transparent; padding: 6px 2px 4px; min-height: 58px; color: var(--muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 0; line-height: 1.5; }
nav.bottom button .ico { line-height: 1; display: flex; align-items: center; justify-content: center; height: 26px; opacity: .8; }
nav.bottom button.active { color: var(--g700); font-weight: 800; }
nav.bottom button.active .ico { opacity: 1; }
nav.bottom button.fab .ico { width: 56px; height: 56px; margin-top: -26px; border-radius: 18px; background: var(--g700); display: flex; align-items: center; justify-content: center; color: #fff; opacity: 1; box-shadow: 0 6px 14px rgba(0,0,0,.28); border: 4px solid #fff; }
nav.bottom button.fab.active .ico { background: var(--g900); }

.card { border-radius: 18px; padding: 12px 14px; margin-bottom: 12px; background: var(--card); box-shadow: var(--shadow); }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.muted { color: var(--muted); font-size: 14px; }
.price { font-weight: 800; color: var(--g900); }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 2px 10px; font-size: 13px; margin-top: 4px; }

/* home */
.today { background: #fff; border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); margin: -4px 0 14px; display: flex; align-items: center; gap: 12px; }
.today .cal { width: 44px; height: 44px; border-radius: 12px; background: var(--g100); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
.today .big { font-size: 22px; font-weight: 800; color: var(--g900); line-height: 1.3; }
.mods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.mod { position: relative; border: 0; background: #fff; border-radius: 20px; padding: 18px 8px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; color: var(--text); min-height: 112px; }
.mod:active { background: var(--g50); }
.mod .mi { width: 54px; height: 54px; border-radius: 16px; background: var(--g100); display: flex; align-items: center; justify-content: center; font-size: 28px; }
.mod.soon { opacity: .55; }
.mod .soonb { position: absolute; top: 8px; inset-inline-start: 8px; font-size: 11px; background: var(--warn-bg); color: var(--warn); padding: 0 8px; border-radius: 999px; font-weight: 600; }

/* billing: search + product tiles */
.searchbar { display: flex; gap: 8px; margin-bottom: 12px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 520px) { .tiles { grid-template-columns: repeat(3, 1fr); } .mods { grid-template-columns: repeat(3, 1fr); } }
.tile { position: relative; background: #fff; border: 2px solid transparent; border-radius: 18px; padding: 12px 12px 10px; box-shadow: var(--shadow); cursor: pointer; min-height: 112px; display: flex; flex-direction: column; gap: 2px; }
.tile.sel { border-color: var(--g500); background: var(--g50); }
.tprice { align-self: flex-start; background: var(--g100); color: var(--g900); font-weight: 800; font-size: 13px; padding: 0 10px; border-radius: 999px; line-height: 1.7; }
.tname { font-weight: 700; margin-top: 4px; line-height: 1.6; word-break: break-word; }
.tstock { font-size: 12px; color: var(--muted); margin-top: auto; }
.tstock.low { color: var(--warn); }
.tstep { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; background: #fff; border-radius: 12px; padding: 2px; }
.tstep button { width: 40px; height: 36px; border: 0; border-radius: 10px; background: var(--g700); color: #fff; font-size: 20px; font-weight: 800; }
.tstep button:last-child { background: #fff; color: var(--g700); border: 1.5px solid var(--g700); }
.tstep span { font-weight: 800; min-width: 28px; text-align: center; }

/* sticky checkout bar */
#billbar { margin: 0 12px 10px; background: var(--g700); color: #fff; border-radius: 18px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
#billbar .bb-info { flex: 1; line-height: 1.4; }
#billbar .bb-total { font-size: 20px; font-weight: 800; }
#billbar .btn { background: #fff; color: var(--g900); }

/* checkout sheet */

// ── demo/dexie-shim.js
// Minimal in-browser stand-in for Dexie (IndexedDB wrapper), used ONLY by the standalone demo file so it runs
// with no internet and no library download. It implements just the calls the app makes. Data lives in memory
// and is mirrored to localStorage, so it survives closing the page. The real app keeps using real Dexie.
(function () {
  const clone = v => (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
  const cmp = (a, b) => {
    if (Array.isArray(a) || Array.isArray(b)) {
      a = [].concat(a); b = [].concat(b);
      for (let i = 0; i < Math.min(a.length, b.length); i++) { const c = cmp(a[i], b[i]); if (c) return c; }
      return a.length - b.length;
    }
    if (typeof a === typeof b) return a < b ? -1 : a > b ? 1 : 0;
    return typeof a === 'number' ? -1 : 1;
  };
  const STORE = 'pos_demo_data_v1';

  class Coll {
    constructor(items, o = {}) { this.items = items; this.o = { filters: [], rev: false, off: 0, lim: Infinity, ...o }; }
    _with(p) { return new Coll(this.items, { ...this.o, ...p }); }
    reverse() { return this._with({ rev: !this.o.rev }); }
    filter(fn) { return this._with({ filters: [...this.o.filters, fn] }); }
    offset(n) { return this._with({ off: n }); }
    limit(n) { return this._with({ lim: n }); }
    _run() {
      let a = this.o.rev ? this.items.slice().reverse() : this.items.slice();
      for (const f of this.o.filters) a = a.filter(f);
      return a.slice(this.o.off, this.o.lim === Infinity ? undefined : this.o.off + this.o.lim);
    }
    async toArray() { return this._run().map(clone); }
    async first() { const r = this._with({ lim: 1 })._run(); return r.length ? clone(r[0]) : undefined; }
    async count() { return this._run().length; }
    async each(fn) { for (const r of this._run()) fn(clone(r)); }
  }

  class Where {
    constructor(table, idx) { this.t = table; this.idx = idx; }
    _key(row) {
      const i = this.idx;
      if (i[0] === '[') {
        const k = i.slice(1, -1).split('+').map(p => row[p]);
        return k.some(v => v == null) ? null : k;
      }
      return row[i] == null ? null : row[i];
    }
    _coll(pred) {
      const pk = this.t.pk;
      const arr = [];
      for (const row of this.t.rows.values()) { const k = this._key(row); if (k !== null && pred(k)) arr.push([k, row]); }
      arr.sort((x, y) => cmp(x[0], y[0]) || cmp(x[1][pk], y[1][pk]));
      return new Coll(arr.map(x => x[1]));
    }
    equals(v) { return this._coll(k => cmp(k, v) === 0); }
    between(lo, hi, incLo = true, incHi = false) {
      return this._coll(k => { const a = cmp(k, lo), b = cmp(k, hi); return (incLo ? a >= 0 : a > 0) && (incHi ? b <= 0 : b < 0); });
    }
  }

  class Table {
    constructor(db, name, spec) {
      this.db = db; this.name = name; this.rows = new Map(); this.counter = 0;
      const first = spec.split(',')[0].trim();
      this.auto = first.startsWith('++'); this.pk = first.replace('++', '');
    }
    _sorted() { return [...this.rows.values()].sort((a, b) => cmp(a[this.pk], b[this.pk])); }
    where(idx) { return new Where(this, idx); }
    async get(k) { const r = this.rows.get(k); return r ? clone(r) : undefined; }
    async bulkGet(ks) { return ks.map(k => { const r = this.rows.get(k); return r ? clone(r) : undefined; }); }
    async put(o) { const r = clone(o); this.rows.set(r[this.pk], r); this.db._dirty(); return r[this.pk]; }
    async add(o) {
      const r = clone(o);
      if (this.auto && r[this.pk] == null) r[this.pk] = ++this.counter;
      else if (this.rows.has(r[this.pk])) throw new Error('Key already exists: ' + r[this.pk]);
      this.rows.set(r[this.pk], r); this.db._dirty(); return r[this.pk];
    }
    async delete(k) { this.rows.delete(k); this.db._dirty(); }
    async count() { return this.rows.size; }
    offset(n) { return new Coll(this._sorted()).offset(n); }
    limit(n) { return new Coll(this._sorted()).limit(n); }
    toArray() { return new Coll(this._sorted()).toArray(); }
  }

  class Dexie {
    constructor(name) { this.name = name; this._t = {}; this._timer = null; }
    version() { return { stores: spec => { for (const n in spec) { this._t[n] = new Table(this, n, spec[n]); this[n] = this._t[n]; } return this; } }; }
    table(n) { return this._t[n]; }
    async open() {
      try {
        const raw = localStorage.getItem(STORE);
        if (raw) {
          const d = JSON.parse(raw);
          for (const n in d.tables) if (this._t[n]) { this._t[n].rows = new Map(d.tables[n].map(r => [r[this._t[n].pk], r])); this._t[n].counter = d.counters[n] || 0; }
        }
      } catch (e) { /* storage blocked: demo still works until the page is closed */ }
      return this;
    }
    _dirty() {
      clearTimeout(this._timer);
      this._timer = setTimeout(() => {
        try {
          const tables = {}, counters = {};
          for (const n in this._t) { tables[n] = [...this._t[n].rows.values()]; counters[n] = this._t[n].counter; }
          localStorage.setItem(STORE, JSON.stringify({ tables, counters }));
        } catch (e) {}
      }, 150);
    }
    async transaction(mode, ...args) {
      const fn = args.pop();
      const tabs = args.filter(a => a instanceof Table);
      const snap = tabs.map(t => [t, new Map(t.rows), t.counter]);
      try { return await fn(); }
      catch (e) { for (const [t, rows, c] of snap) { t.rows = rows; t.counter = c; } throw e; }
    }
  }
  window.Dexie = Dexie;
})();

<script>
// ── db.js
// Universal POS — local database (Dexie / IndexedDB). Stage 2.
// Requires Dexie (loaded before this file).

const db = new Dexie('universal_pos');

// First entry is the primary key (UUID string). [shop_id+x] compound indexes keep queries per shop.
db.version(1).stores({
  categories:      'id, [shop_id+name], sync_status, updated_at',
  products:        'id, [shop_id+barcode], [shop_id+name], [shop_id+category_id], sync_status, updated_at',
  customers:       'id, [shop_id+name], [shop_id+phone], sync_status, updated_at',
  suppliers:       'id, [shop_id+name], sync_status, updated_at',
  sales:           'id, [shop_id+created_at], [shop_id+invoice_no], [shop_id+customer_id], sync_status',
  sale_items:      'id, [shop_id+sale_id], [shop_id+product_id], sync_status',
  purchases:       'id, [shop_id+created_at], [shop_id+supplier_id], sync_status',
  purchase_items:  'id, [shop_id+purchase_id], [shop_id+product_id], sync_status',
  payments:        'id, [shop_id+created_at], [shop_id+party_id], sync_status',
  expenses:        'id, [shop_id+created_at], sync_status',
  stock_movements: 'id, [shop_id+product_id], [shop_id+created_at], sync_status',
  sync_queue:      '++seq, record_id, table_name, status, next_retry_at, [status+seq]',
  sync_logs:       '++id, at, level',
  conflicts:       'id, shop_id, table_name, record_id, resolved_at',
  app_settings:    'key'
});

// Stage: shared catalog (read-only, local only — NOT in BUSINESS_TABLES, never synced)
db.version(2).stores({
  catalog_items: 'id, type, [type+cat]'
});

const BUSINESS_TABLES = ['categories','products','customers','suppliers','sales','sale_items',
  'purchases','purchase_items','payments','expenses','stock_movements'];

// ───────── Helpers ─────────

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function round3(n) { return Math.round((n + Number.EPSILON) * 1000) / 1000; }

async function getSetting(key, fallback = null) {
  const row = await db.app_settings.get(key);
  return row ? row.value : fallback;
}
async function setSetting(key, value) { await db.app_settings.put({ key, value }); }
async function delSetting(key) { await db.app_settings.delete(key); }

async function getDeviceId() {
  let id = await getSetting('device_id');
  if (!id) { id = uuid(); await setSetting('device_id', id); }
  return id;
}

// Build a business record with all required base fields.
// NOTE: reads app_settings, so any transaction that calls this must include db.app_settings.
async function newRecord(data) {
  const now = new Date().toISOString();
  const shop_id = await getSetting('shop_id');
  if (!shop_id) throw new Error('No shop selected');
  return {
    id: uuid(),
    shop_id,
    device_id: await getDeviceId(),
    created_at: now,
    updated_at: now,
    version: 1,
    sync_status: 'pending',
    ...data
  };
}

// Queue entry for the sync engine (Stage 3). Call inside the same transaction as the record write.
function enqueue(table, record, op = 'insert') {
  return db.sync_queue.add({
    table_name: table,
    record_id: record.id,
    shop_id: record.shop_id,
    op,
    base_version: op === 'update' ? record.version - 1 : 0,
    status: 'pending',
    attempts: 0,
    next_retry_at: 0,
    created_at: new Date().toISOString()
  });
}

async function logSync(level, message, detail = null) {
  await db.sync_logs.add({ at: new Date().toISOString(), level, message, detail });
}

// Invoice number = 6 chars of device id + local counter. Must run inside a transaction with app_settings.
async function nextInvoiceNo() {
  const dev = (await getDeviceId()).replace(/-/g, '').slice(0, 6).toUpperCase();
  const n = (await getSetting('invoice_counter', 0)) + 1;
  await setSetting('invoice_counter', n);
  return `${dev}-${String(n).padStart(6, '0')}`;
}

// ───────── Sales ─────────
// sale:  { customer_id, discount, tax_rate, paid, payment_method, created_by }
// items: [{ product_id, product_name, qty, unit_price, cost_price }]
// Everything is written in ONE transaction: a crash can never leave a half-saved sale.
async function saveSale(sale, items) {
  if (!items || !items.length) throw new Error('Cart is empty');
  for (const it of items) {
    if (!(it.qty > 0)) throw new Error('Invalid quantity');
    if (!(it.unit_price >= 0)) throw new Error('Invalid price');
    if (it.unit_factor != null && !(Number(it.unit_factor) > 0)) throw new Error('Invalid unit');
  }
  const subtotal = round2(items.reduce((s, it) => s + round2(it.qty * it.unit_price), 0));
  const discount = round2(sale.discount || 0);
  if (discount < 0 || discount > subtotal) throw new Error('Invalid discount');
  const tax = round2((subtotal - discount) * (sale.tax_rate || 0) / 100);
  const total = round2(subtotal - discount + tax);
  const paid = round2(sale.paid == null ? total : sale.paid);
  if (paid < 0) throw new Error('Invalid paid amount');

  return db.transaction('rw',
    db.sales, db.sale_items, db.stock_movements, db.sync_queue, db.app_settings, async () => {
      const saleRec = await newRecord({
        invoice_no: await nextInvoiceNo(),
        customer_id: sale.customer_id || null,
        subtotal, discount, tax, total, paid,
        payment_method: sale.payment_method || 'cash',
        status: 'completed',
        created_by: sale.created_by || null
      });
      await db.sales.add(saleRec);
      await enqueue('sales', saleRec);

      for (const it of items) {
        const itemRec = await newRecord({
          sale_id: saleRec.id,
          product_id: it.product_id,
          product_name: it.product_name,
          qty: round3(it.qty),
          unit_name: it.unit_name || null,
          unit_factor: unitFactor(it),
          unit_price: round2(it.unit_price),
          cost_price: round2(it.cost_price || 0),
          discount: 0,
          line_total: round2(it.qty * it.unit_price)
        });
        await db.sale_items.add(itemRec);
        await enqueue('sale_items', itemRec);

        const mv = await newRecord({
          product_id: it.product_id,
          qty_change: -round3(Math.abs(it.qty) * unitFactor(it)),
          reason: 'sale', ref_type: 'sale', ref_id: saleRec.id
        });
        await db.stock_movements.add(mv);
        await enqueue('stock_movements', mv);
      }
      return saleRec;
    });
}

// Cancel a sale (bill return): the sale stays for history with status 'void', stock is put back through
// reverse stock movements (ledger), and the customer's balance / reports ignore it automatically.
async function voidSale(saleId, reason = '') {
  return db.transaction('rw', db.sales, db.sale_items, db.stock_movements, db.sync_queue, db.app_settings, async () => {
    const sale = await db.sales.get(saleId);
    if (!sale) throw new Error('Sale not found');
    if (sale.status === 'void') throw new Error('Already cancelled');
    const now = new Date().toISOString();
    const rec = { ...sale, status: 'void', void_reason: (reason || '').trim() || null, voided_at: now,
                  refunded: round2((sale.refunded || 0) + (sale.paid || 0)),
                  version: sale.version + 1, updated_at: now, sync_status: 'pending' };
    await db.sales.put(rec); await enqueue('sales', rec, 'update');
    const items = await db.sale_items.where('[shop_id+sale_id]').equals([sale.shop_id, saleId]).toArray();
    for (const it of items) {
      const mv = await newRecord({ product_id: it.product_id, qty_change: round3(Math.abs(it.qty) * unitFactor(it)),
                                   reason: 'sale_void', ref_type: 'sale', ref_id: saleId });
      await db.stock_movements.add(mv); await enqueue('stock_movements', mv);
    }
    return rec;
  });
}

// Partial return: lines = [{ item_id, qty }]. Reduces the sale line, the sale totals (discount/tax scaled in proportion),
// puts stock back (ledger) and reduces `paid` only by what must be refunded (credit part is just removed from the udhaar).
async function returnSaleItems(saleId, lines, reason = '') {
  lines = (lines || []).filter(l => l.qty > 0);
  if (!lines.length) throw new Error('Nothing to return');
  return db.transaction('rw', db.sales, db.sale_items, db.stock_movements, db.sync_queue, db.app_settings, async () => {
    const sale = await db.sales.get(saleId);
    if (!sale) throw new Error('Sale not found');
    if (sale.status === 'void') throw new Error('Already cancelled');
    const items = await db.sale_items.where('[shop_id+sale_id]').equals([sale.shop_id, saleId]).toArray();
    const byId = Object.fromEntries(items.map(i => [i.id, i]));
    const now = new Date().toISOString();
    let value = 0;
    for (const l of lines) {
      const it = byId[l.item_id]; if (!it) throw new Error('Item not found');
      const q = round3(l.qty);
      if (q > it.qty + 1e-9) throw new Error('Return quantity is more than sold');
      const amount = round2(q * it.unit_price);
      value = round2(value + amount);
      const upd = { ...it, qty: round3(it.qty - q), returned_qty: round3((it.returned_qty || 0) + q),
                    line_total: round2(it.line_total - amount), version: it.version + 1, updated_at: now, sync_status: 'pending' };
      await db.sale_items.put(upd); await enqueue('sale_items', upd, 'update');
      byId[it.id] = upd;
      const mv = await newRecord({ product_id: it.product_id, qty_change: round3(q * unitFactor(it)), reason: 'sale_return', ref_type: 'sale', ref_id: saleId });
      await db.stock_movements.add(mv); await enqueue('stock_movements', mv);
    }
    const ratio = sale.subtotal > 0 ? value / sale.subtotal : 1;
    const subtotal = round2(sale.subtotal - value);
    const discount = round2(sale.discount * (1 - ratio));
    const tax = round2(sale.tax * (1 - ratio));
    const total = round2(subtotal - discount + tax);
    const paid = round2(Math.min(sale.paid, total));
    const allGone = Object.values(byId).every(i => i.qty <= 0);
    const rec = { ...sale, subtotal, discount, tax, total, paid,
                  returned_total: round2((sale.returned_total || 0) + (sale.total - total)),
                  refunded: round2((sale.refunded || 0) + (sale.paid - paid)),
                  status: allGone ? 'void' : sale.status, void_reason: allGone ? ((reason || '').trim() || 'full return') : sale.void_reason,
                  note_return: (reason || '').trim() || sale.note_return || null,
                  version: sale.version + 1, updated_at: now, sync_status: 'pending' };
    await db.sales.put(rec); await enqueue('sales', rec, 'update');
    return rec;
  });
}

async function getSaleWithItems(saleId) {
  const sale = await db.sales.get(saleId);
  if (!sale) return null;
  const items = await db.sale_items.where('[shop_id+sale_id]').equals([sale.shop_id, saleId]).toArray();
  return { sale, items };
}

function listSales(shopId, page = 0, pageSize = 30) {
  return db.sales.where('[shop_id+created_at]')
    .between([shopId, ''], [shopId, '￿'])
    .reverse().filter(s => !s.deleted_at).offset(page * pageSize).limit(pageSize).toArray();
}

// Remove a CANCELLED bill from the sales history. Only a bill that is already void can be removed.
// It is a soft delete (deleted_at) so it syncs to the server and disappears on every phone.
// Stock was already put back when the bill was cancelled, so nothing else changes; reports keep counting
// the cash that was refunded for it.
async function deleteVoidSale(saleId) {
  return db.transaction('rw', db.sales, db.sale_items, db.sync_queue, db.app_settings, async () => {
    const sale = await db.sales.get(saleId);
    if (!sale) throw new Error('Sale not found');
    if (sale.status !== 'void') throw new Error('Only a cancelled bill can be removed');
    if (sale.deleted_at) return sale;
    const now = new Date().toISOString();
    const rec = { ...sale, deleted_at: now, version: sale.version + 1, updated_at: now, sync_status: 'pending' };
    await db.sales.put(rec); await enqueue('sales', rec, 'update');
    const items = await db.sale_items.where('[shop_id+sale_id]').equals([sale.shop_id, saleId]).toArray();
    for (const it of items) {
      const upd = { ...it, deleted_at: now, version: it.version + 1, updated_at: now, sync_status: 'pending' };
      await db.sale_items.put(upd); await enqueue('sale_items', upd, 'update');
    }
    return rec;
  });
}

// ───────── Products & stock ─────────

// Stock = sum of append-only movements (the source of truth).
async function getStock(shopId, productId) {
  let total = 0;
  await db.stock_movements.where('[shop_id+product_id]').equals([shopId, productId])
    .each(m => { total += m.qty_change; });
  return round3(total);
}

async function getStocks(shopId, productIds) {
  const arr = await Promise.all(productIds.map(id => getStock(shopId, id)));
  const map = {};
  productIds.forEach((id, i) => { map[id] = arr[i]; });
  return map;
}

function findByBarcode(shopId, barcode) {
  return db.products.where('[shop_id+barcode]').equals([shopId, barcode])
    .filter(p => !p.deleted_at && p.is_active !== false).first();
}

function productMatcher(q) {
  const s = (q || '').trim().toLowerCase();
  return p => {
    if (p.deleted_at || p.is_active === false) return false;
    if (!s) return true;
    return (p.name || '').toLowerCase().includes(s) ||
           (p.name_ur || '').toLowerCase().includes(s) ||
           (p.sku || '').toLowerCase().includes(s) ||
           (p.barcode || '') === s;
  };
}

// Offline search: walks the name index and stops as soon as `limit` matches are found.
function searchProducts(shopId, q, limit = 20) {
  return db.products.where('[shop_id+name]').between([shopId, ''], [shopId, '￿'])
    .filter(productMatcher(q)).limit(limit).toArray();
}

function listProducts(shopId, q, page = 0, pageSize = 30) {
  return db.products.where('[shop_id+name]').between([shopId, ''], [shopId, '￿'])
    .filter(productMatcher(q)).offset(page * pageSize).limit(pageSize).toArray();
}

// Extra selling units of a product: [{ name, factor, price|null }]. factor = how many BASE units one of this unit holds
// (carton = 12 pcs -> factor 12). Stock is always kept in the base unit (product.unit).
function normalizeUnits(list, baseUnit) {
  const seen = new Set([String(baseUnit || '').trim().toLowerCase()]), out = [];
  for (const u of Array.isArray(list) ? list : []) {
    const name = String((u && u.name) || '').trim(), factor = round3(Number(u && u.factor));
    if (!name || !(factor > 0) || !isFinite(factor) || seen.has(name.toLowerCase())) continue;
    seen.add(name.toLowerCase());
    const price = u.price === '' || u.price == null ? null : round2(Number(u.price));
    out.push({ name, factor, price: price != null && isFinite(price) && price >= 0 ? price : null });
    if (out.length >= 4) break;
  }
  return out;
}
const unitFactor = it => (Number(it && it.unit_factor) > 0 ? Number(it.unit_factor) : 1);

// Create or update a product. opts: { openingStock, adjust, adjustNote }
async function saveProduct(data, opts = {}) {
  const name = (data.name || '').trim();
  if (!name) throw new Error('Name required');
  const fields = {
    name,
    name_ur: (data.name_ur || '').trim() || null,
    barcode: (data.barcode || '').trim() || null,
    sku: (data.sku || '').trim() || null,
    unit: (data.unit || 'pcs').trim() || 'pcs',
    cost_price: round2(Number(data.cost_price) || 0),
    sale_price: round2(Number(data.sale_price) || 0),
    min_stock: round3(Number(data.min_stock) || 0),
    is_active: data.is_active !== false
  };
  if (data.variant_group) { fields.variant_group = data.variant_group; fields.variant_label = String(data.variant_label || '').trim() || null; }
  if (data.units !== undefined) fields.units = normalizeUnits(data.units, fields.unit);   // undefined = keep what the product has
  if (fields.sale_price < 0 || fields.cost_price < 0) throw new Error('Invalid price');

  return db.transaction('rw', db.products, db.stock_movements, db.sync_queue, db.app_settings, async () => {
    let rec;
    if (data.id) {
      const old = await db.products.get(data.id);
      if (!old) throw new Error('Product not found');
      rec = { ...old, ...fields, version: old.version + 1,
              updated_at: new Date().toISOString(), sync_status: 'pending' };
      await db.products.put(rec);
      await enqueue('products', rec, 'update');
    } else {
      rec = await newRecord({ category_id: null, deleted_at: null, units: [], ...fields });
      await db.products.add(rec);
      await enqueue('products', rec, 'insert');
    }
    const qty = data.id ? Number(opts.adjust) : Number(opts.openingStock);
    if (qty && isFinite(qty)) {
      const mv = await newRecord({
        product_id: rec.id, qty_change: round3(qty),
        reason: data.id ? 'adjustment' : 'opening', ref_type: 'product', ref_id: rec.id,
        note: opts.adjustNote || null
      });
      await db.stock_movements.add(mv);
      await enqueue('stock_movements', mv);
    }
    return rec;
  });
}

// ───────── Customers & credit (udhaar) ─────────
// Balance a customer owes = opening balance
//   + Σ unpaid part of each completed sale (total − paid, never negative)
//   + Σ manual "charge" entries
//   − Σ "receipt" entries (money received later).
// Nothing is stored as a running total: it is always computed from the records, so it can never drift.

function customerMatcher(q) {
  const s = (q || '').trim().toLowerCase();
  return c => {
    if (c.deleted_at) return false;
    if (!s) return true;
    return (c.name || '').toLowerCase().includes(s) || (c.phone || '').includes(s);
  };
}

    address: (data.address || '').trim() || null,

  return db.transaction('rw', db.customers, db.sync_queue, db.app_settings, async () => {
    let rec;

async function getCustomerBalance(shopId, customerId) {
  const c = await db.customers.get(customerId);

  await db.sales.where('[shop_id+customer_id]').equals([shopId, customerId])

  await db.payments.where('[shop_id+party_id]').equals([shopId, customerId])
    .each(p => { if (p.party_type === 'customer' && !p.voided) bal += p.kind === 'charge' ? p.amount : -p.amount; });

// Full ledger, oldest → newest with a running balance. The caller reverses/slices for display.
async function getCustomerLedger(shopId, customerId) {
  const c = await db.customers.get(customerId);
  const rows = [];
  const open = c ? (c.opening_balance || 0) : 0;
  if (open) rows.push({ type: 'opening', at: c.created_at, delta: open });
  await db.sales.where('[shop_id+customer_id]').equals([shopId, customerId]).each(s => {
    if (s.status === 'void') return;
    rows.push({ type: 'sale', at: s.created_at, delta: Math.max(0, round2(s.total - s.paid)), total: s.total, paid: s.paid, ref: s.invoice_no, id: s.id });
  });
  await db.payments.where('[shop_id+party_id]').equals([shopId, customerId]).each(p => {
    if (p.party_type !== 'customer' || p.voided) return;
    rows.push({ type: p.kind, at: p.created_at, delta: p.kind === 'charge' ? p.amount : -p.amount, note: p.note });
  });
  rows.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
  let run = 0;
  for (const r of rows) { run = round2(run + r.delta); r.running = run; }
  return rows;
}

// purchase: { supplier_id, paid, note, created_by, update_cost }   items: [{ product_id, product_name, qty, unit_cost }]
// One transaction: purchase + lines + stock increase (+ optional cost-price update). All or nothing.
async function savePurchase(purchase, items) {
  if (!items || !items.length) throw new Error('Cart is empty');
  for (const it of items) {
    if (!(it.qty > 0)) throw new Error('Invalid quantity');
    if (!(it.unit_cost >= 0)) throw new Error('Invalid price');
    if (it.unit_factor != null && !(Number(it.unit_factor) > 0)) throw new Error('Invalid unit');
  }
  const total = round2(items.reduce((s, it) => s + round2(it.qty * it.unit_cost), 0));
  const paid = round2(purchase.paid == null ? total : purchase.paid);
  if (paid < 0) throw new Error('Invalid paid amount');
  return db.transaction('rw', db.purchases, db.purchase_items, db.products, db.stock_movements, db.sync_queue, db.app_settings, async () => {
    const rec = await newRecord({
      ref_no: 'P' + (await nextInvoiceNo()),
      supplier_id: purchase.supplier_id || null,
      total, paid, status: 'completed', note: (purchase.note || '').trim() || null,
      created_by: purchase.created_by || null
    });
    await db.purchases.add(rec);
    await enqueue('purchases', rec);
    for (const it of items) {
      const line = await newRecord({
        purchase_id: rec.id, product_id: it.product_id, product_name: it.product_name,
        qty: round3(it.qty), unit_name: it.unit_name || null, unit_factor: unitFactor(it),
        unit_cost: round2(it.unit_cost), line_total: round2(it.qty * it.unit_cost)
      });
      await db.purchase_items.add(line);
      await enqueue('purchase_items', line);
      const mv = await newRecord({ product_id: it.product_id, qty_change: round3(Math.abs(it.qty) * unitFactor(it)), reason: 'purchase', ref_type: 'purchase', ref_id: rec.id });
      await db.stock_movements.add(mv);
      await enqueue('stock_movements', mv);
      if (purchase.update_cost) {
        const old = await db.products.get(it.product_id);
        const baseCost = round2(it.unit_cost / unitFactor(it));      // product cost is always per BASE unit
        if (old && old.cost_price !== baseCost) {
          const up = { ...old, cost_price: baseCost, version: old.version + 1, updated_at: new Date().toISOString(), sync_status: 'pending' };
          await db.products.put(up);
          await enqueue('products', up, 'update');
        }
      }
    }
    return rec;
  });
}

function pendingCount() { return db.sync_queue.where('status').equals('pending').count(); }

// Local export (JSON). Built table by table, in chunks, to keep memory reasonable.
async function exportAllData() {
  const parts = ['{"exported_at":' + JSON.stringify(new Date().toISOString()) + ',"tables":{'];
  const names = [...BUSINESS_TABLES, 'sync_queue', 'conflicts'];
  for (let i = 0; i < names.length; i++) {
    const t = names[i];
    parts.push((i ? ',' : '') + JSON.stringify(t) + ':[');
    let first = true;
    const total = await db.table(t).count();
    for (let off = 0; off < total; off += 500) {
      const rows = await db.table(t).offset(off).limit(500).toArray();
      for (const r of rows) { parts.push((first ? '' : ',') + JSON.stringify(r)); first = false; }
    }
    parts.push(']');
  }
  parts.push('}}');
  return new Blob(parts, { type: 'application/json' });
}

<script>
// ── sync.js
// Universal POS — Sync Engine (Stage 3).
// Local DB (Dexie) is always the source the UI reads. This engine only moves data:
//   1) PUSH  pending records from sync_queue -> Supabase (sync_push RPC), with retry/backoff
//   2) PULL  records changed on the server (other devices) -> local DB (sync_pull RPC, server-time cursor)
// Conflict rule: higher version wins; same version -> newer updated_at wins; otherwise the SERVER copy wins
// and the losing local copy is kept in the `conflicts` table for review. Stock is a ledger (stock_movements),
// so stock from several devices always adds up and never conflicts.

const SYNC = {
  running: false, timer: null, debounce: null, lastError: null, lastOk: null,
  BATCH: 100, MAX_ATTEMPTS: 8, INTERVAL: 30000
};

function syncEnabled() { return !window.POS_DEMO && typeof db !== 'undefined' && S.session && navigator.onLine; }

function syncSchedule(ms = 1500) {            // call after local writes; coalesces bursts into one run
  clearTimeout(SYNC.debounce);
  SYNC.debounce = setTimeout(() => syncRun(), ms);
}

function syncStart() {
  if (window.POS_DEMO || syncStart._on) return;
  syncStart._on = true;
  db.sync_queue.hook('creating', () => { syncSchedule(); });   // every enqueue() triggers a (debounced) sync
  window.addEventListener('online', () => syncRun());
  SYNC.timer = setInterval(() => syncRun(), SYNC.INTERVAL);
  syncRun();
}

function syncBackoff(attempts) { return Date.now() + Math.min(5000 * 2 ** attempts, 10 * 60 * 1000); }

// Returns true if the failure is about login/permissions (retrying won't help).
function syncIsAuthError(e) {
  const m = String((e && (e.message || e.code)) || '');
  return /not_member|shop_blocked|JWT|401|403|42501|not authenticated/i.test(m);
}

// Wrapper: the server may stop (or ask to re-register) this device; see device.js
async function syncRun(opts = {}) {
  const r = await syncRunOnce(opts);
  if (r && r.deviceRetry) {                                // e.g. app updated: this device was never registered yet
    try { await deviceRegister(getSb(), S.session); } catch (e) { return deviceKick(e.deviceBlocked ? e.message : t('err_generic')); }
    return syncRunOnce(opts);
  }
  if (r && r.deviceBlocked) return deviceKick(deviceErrText(r.deviceBlocked));
  return r;
}
async function syncRunOnce(opts = {}) {
  if (SYNC.running || !syncEnabled()) return { skipped: true };
  const locked = async fn => (navigator.locks ? navigator.locks.request('pos-sync', { ifAvailable: true }, l => l ? fn() : { skipped: true }) : fn());
  SYNC.running = true; syncUi();
  try {
    return await locked(async () => {
      const sb = getSb();
      const { data: ses } = await sb.auth.getSession();
      if (!ses || !ses.session) { SYNC.lastError = 'auth'; await logSync('warn', 'sync: no auth session'); return { error: 'auth' }; }
      if (!(await pingServer())) return { offline: true };
      const shop = await getSetting('shop_id'); if (!shop) return { error: 'no_shop' };
      const pushed = await syncPush(sb, shop);
      const pulled = await syncPull(sb, shop);
      await syncShopCfg(sb, shop);                  // رسید کی سیٹنگز (فون، پتہ...) سرور کے ساتھ
      SYNC.lastError = null; SYNC.lastOk = new Date().toISOString();
      await setSetting('last_sync_at', SYNC.lastOk);
      await syncCheckExpiry(sb, shop);
      await syncTrimLogs();
      return { pushed, pulled };
    });
  } catch (e) {
    const dm = String((e && e.message) || e);
    if (/device_unregistered/.test(dm) && !opts.devTried) { opts.devTried = true; return { deviceRetry: true }; }
    if (/device_revoked|device_limit|device_unregistered/.test(dm)) return { deviceBlocked: dm };
    SYNC.lastError = syncIsAuthError(e) ? 'auth' : (e.message || String(e));
    try { await logSync('error', 'sync failed', String(e && e.message || e)); } catch (x) {}
    return { error: SYNC.lastError };
  } finally {
    SYNC.running = false; syncUi();
    if (typeof refreshStatus === 'function') refreshStatus();
  }
}

// ───────── PUSH ─────────
async function syncPush(sb, shop) {
  let total = 0;
  for (let round = 0; round < 50; round++) {                       // safety cap
    const entries = await db.sync_queue.where('status').equals('pending')
      .filter(q => (q.next_retry_at || 0) <= Date.now() && q.shop_id === shop).limit(500).toArray();
    if (!entries.length) break;

    // latest local state per record (many queue entries for one record collapse into one push)
    const groups = {};                                            // table -> id -> { maxSeq, seqs[] }
    for (const q of entries) {
      const g = ((groups[q.table_name] ||= {})[q.record_id] ||= { seqs: [], maxSeq: 0 });
      g.seqs.push(q.seq); g.maxSeq = Math.max(g.maxSeq, q.seq);
    }
    let progressed = false;
    for (const table of Object.keys(groups)) {
      const ids = Object.keys(groups[table]);
      for (let i = 0; i < ids.length; i += SYNC.BATCH) {
        const chunkIds = ids.slice(i, i + SYNC.BATCH);
        const recs = (await db.table(table).bulkGet(chunkIds));
        const rows = [], sent = {};
        chunkIds.forEach((id, k) => {
          const r = recs[k];
          if (!r) { db.sync_queue.bulkDelete(groups[table][id].seqs); return; }   // record gone: nothing to send
          const { sync_status, ...payload } = r; rows.push(payload); sent[id] = r.version;
        });
        if (!rows.length) continue;
        let res;
        try {
          const { data, error } = await sb.rpc('sync_push', { p_shop: shop, p_table: table, p_rows: rows });
          if (error) throw error; res = data || [];
        } catch (e) {
          if (syncIsAuthError(e)) throw e;                          // stop everything, show "login again"
          for (const id of Object.keys(sent)) await syncMarkAttempt(groups[table][id].seqs, e);
          throw e;                                                  // network/server trouble: try later
        }
        for (const out of res) {
          const g = groups[table][out.id]; if (!g) continue;
          if (out.status === 'ok') {
            // mark synced only if the record wasn't edited again while the request was in flight
            await db.transaction('rw', db.table(table), db.sync_queue, async () => {
              const cur = await db.table(table).get(out.id);
              if (cur && cur.version === sent[out.id]) await db.table(table).update(out.id, { sync_status: 'synced' });
              await db.sync_queue.bulkDelete(g.seqs);
            });
          } else if (out.status === 'conflict') {
            await syncResolveConflict(table, out.id, out.server, g.seqs);
          } else if (out.status === 'denied') {       // role not allowed on the server: stop retrying, show as failed
            await db.sync_queue.bulkUpdate(g.seqs.map(seq => ({ key: seq, changes: { status: 'failed', last_error: 'denied' } })));
            await logSync('warn', `denied by server (role) on ${table}`, out.id);
          }
          total++; progressed = true;
        }
      }
    }
    if (!progressed) break;
  }
  return total;
}

async function syncMarkAttempt(seqs, err) {
  await db.transaction('rw', db.sync_queue, async () => {
    for (const seq of seqs) {
      const q = await db.sync_queue.get(seq); if (!q) continue;
      const attempts = (q.attempts || 0) + 1;
      await db.sync_queue.update(seq, {
        attempts, last_error: String(err && err.message || err).slice(0, 300),
        status: attempts >= SYNC.MAX_ATTEMPTS ? 'failed' : 'pending',
        next_retry_at: syncBackoff(attempts)
      });
    }
  });
}

async function syncResolveConflict(table, id, serverRec, seqs) {
  await db.transaction('rw', db.table(table), db.conflicts, db.sync_queue, async () => {
    const local = await db.table(table).get(id);
    await db.conflicts.put({
      id: uuid(), shop_id: local ? local.shop_id : serverRec.shop_id, table_name: table, record_id: id,
      local: local || null, server: serverRec, detected_at: new Date().toISOString(), resolved_at: null, resolution: 'server_wins'
    });
    if (serverRec) await db.table(table).put({ ...serverRec, sync_status: 'synced' });
    await db.sync_queue.bulkDelete(seqs);
  });
  await logSync('warn', `conflict on ${table}`, id);
}

// ───────── PULL ─────────
async function syncPull(sb, shop) {
  let total = 0;
  for (const table of BUSINESS_TABLES) {
    const key = `pull_cursor_${shop}_${table}`;
    let cursor = await getSetting(key, null);
    for (let round = 0; round < 200; round++) {
      const { data, error } = await sb.rpc('sync_pull', { p_shop: shop, p_table: table, p_since: cursor, p_limit: 500 });
      if (error) throw error;
      const rows = data || [];
      if (!rows.length) break;
      await db.transaction('rw', db.table(table), db.app_settings, async () => {
        const ids = rows.map(r => r.data.id);
        const locals = await db.table(table).bulkGet(ids);
        const put = [];
        rows.forEach((r, i) => {
          const l = locals[i], s = r.data;
          if (l && l.sync_status === 'pending') return;           // unsynced local change: its push decides
          if (l && l.version > s.version) return;                 // local is newer
          put.push({ ...s, sync_status: 'synced' });
        });
        if (put.length) await db.table(table).bulkPut(put);
        await setSetting(key, rows[rows.length - 1].server_ts);
      });
      cursor = rows[rows.length - 1].server_ts;
      total += rows.length;
      if (rows.length < 500) break;
    }
  }
  return total;
}

// ───────── Receipt settings (shop-wide: header, footer, phone, address, NTN) ─────────
// These live on the server (shops.settings) so every phone of the shop shows the same receipt text.
// Paper size, language and theme stay per-device on purpose (they depend on the phone/printer).
const SHOP_CFG_KEYS = ['receipt_header', 'receipt_footer', 'shop_phone', 'shop_address', 'shop_tax_no', 'business_type'];
const shopCfgCanWrite = () => S.session && ['owner', 'manager'].includes(S.session.role);

async function shopCfgChanged() {                  // call after the user edits one of SHOP_CFG_KEYS
  if (window.POS_DEMO || !shopCfgCanWrite()) return;
  const shop = await getSetting('shop_id'); if (!shop) return;
  await setSetting('cfg_dirty_' + shop, true);
  setSetting('cfg_shop', shop).catch(() => {});
  syncSchedule(300);
}

async function syncShopCfg(sb, shop) {
  try {
    const dirtyKey = 'cfg_dirty_' + shop;
    const localShop = await getSetting('cfg_shop', null);          // which shop this phone's saved cfg belongs to
    const pick = () => Object.fromEntries(SHOP_CFG_KEYS.map(k => [k, S.cfg[k] || '']));
    const hasLocal = SHOP_CFG_KEYS.some(k => S.cfg[k]);
    const { data, error } = await sb.rpc('get_shop_settings', { p_shop: shop });
    if (error) throw error;
    const server = data && typeof data === 'object' ? data : {};
    const hasServer = SHOP_CFG_KEYS.some(k => server[k]);

    // phone was used with another shop before: its receipt text must not leak into this shop
    if (localShop && localShop !== shop) {
      for (const k of SHOP_CFG_KEYS) await saveCfg(k, '');
      await setSetting('cfg_shop', shop);
    }
    const mine = !localShop || localShop === shop;                  // old installs (no marker) count as this shop's

    if (await getSetting(dirtyKey, false) || (mine && hasLocal && !hasServer)) {
      // local edit not yet on the server (or first upload from the phone that already had the data)
      if (!shopCfgCanWrite()) return;
      const { error: e2 } = await sb.rpc('save_shop_settings', { p_shop: shop, p_settings: pick() });
      if (e2) throw e2;
      await setSetting(dirtyKey, false); await setSetting('cfg_shop', shop);
      return;
    }
    // otherwise the server copy wins and is applied on this phone
    let changed = false;
    for (const k of SHOP_CFG_KEYS) {
      const v = typeof server[k] === 'string' ? server[k] : '';
      if ((S.cfg[k] || '') !== v) { await saveCfg(k, v); changed = true; }
    }
    await setSetting('cfg_shop', shop);
    if (changed && S.tab === 'settings' && !(document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))) renderSettings();
  } catch (e) {
    if (syncIsAuthError(e)) throw e;
    try { await logSync('warn', 'shop settings sync failed', String(e && e.message || e)); } catch (x) {}   // e.g. 04 SQL not run yet
  }
}

// ───────── Housekeeping, retry, UI ─────────
async function syncTrimLogs() {
  const n = await db.sync_logs.count();
  if (n > 500) { const old = await db.sync_logs.orderBy('id').limit(n - 500).primaryKeys(); await db.sync_logs.bulkDelete(old); }
}

async function syncRetryFailed() {
  await db.sync_queue.where('status').equals('failed').modify({ status: 'pending', attempts: 0, next_retry_at: 0 });
  return syncRun();
}

function syncUi() {
  const el = document.getElementById('sync-state'); if (!el) return;
  el.textContent = SYNC.running ? t('sync_running')
    : SYNC.lastError === 'auth' ? t('sync_auth')
    : SYNC.lastError ? t('sync_error') + ': ' + SYNC.lastError
    : SYNC.lastOk ? t('sync_ok') + ' · ' + fmtDate(SYNC.lastOk) : t('sync_idle');
}

// ───────── Subscription expiry ─────────
async function syncCheckExpiry(sb, shop) {
  try {
    const { data } = await sb.from('shops').select('expires_at, plan_id').eq('id', shop).maybeSingle();
    if (!data) return;
    S.session.expires_at = data.expires_at;
    try {                                            // plan features (e.g. bill QR). On error keep what we already know.
      const pl = await sb.from('plans').select('bill_qr, barcodes').eq('id', data.plan_id).maybeSingle();
      if (!pl.error && pl.data) { S.session.bill_qr = pl.data.bill_qr === true; S.session.barcodes = pl.data.barcodes === true; }
    } catch (x) {}
    try { if (typeof termsPush === 'function') await termsPush(); } catch (x) {}
    try { if (typeof avatarPull === 'function') await avatarPull(sb, shop); } catch (x) {}     // profile picture
    try {                                            // sessions saved before names existed: fetch the person's name once
      const m = await sb.from('shop_members').select('name').eq('shop_id', shop).eq('user_id', S.session.user_id).maybeSingle();
      if (m.data && m.data.name && m.data.name !== S.session.user_name) {
        S.session.user_name = m.data.name;
        if (S.tab === 'home') { const h = document.getElementById('hdr-hello'); if (h) h.textContent = m.data.name; }
      }
    } catch (x) {}
    await setSetting('session', S.session);
    const d = syncDaysLeft();
    if (d !== null && d <= 7 && !syncCheckExpiry._warned) { syncCheckExpiry._warned = true; toast(syncExpiryText(), 6000); }
  } catch (e) {}
}
// Plan features. The demo has everything; live shops get a feature only when their plan switches it on.
const planHasBarcode = () => !!window.POS_DEMO || !!(S.session && S.session.barcodes === true);
function syncDaysLeft() {
  if (!S.session || !S.session.expires_at) return null;
  return Math.ceil((new Date(S.session.expires_at).getTime() - Date.now()) / 86400000);
}
function syncExpiryText() {
  const d = syncDaysLeft();
  return d === null ? '' : d < 0 ? t('sub_expired') : t('sub_days').replace('{n}', d);
}

// ───────── Conflict review ─────────
const conflictLabel = r => r ? (r.name || r.invoice_no || r.product_name || (r.id || '').slice(0, 8)) : '—';
async function syncShowConflicts() {
  const list = await db.conflicts.filter(c => !c.resolved_at).toArray();
  openModal(`<h3>${t('sync_conflicts')}</h3>` + (list.length ? list.map(c => `
    <div class="card" style="margin-bottom:8px"><b>${esc(c.table_name)}</b> · ${esc(conflictLabel(c.server || c.local))}
      <div class="muted">${t('cf_local')}: ${esc(fmtDate(c.local && c.local.updated_at))} · ${t('cf_server')}: ${esc(fmtDate(c.server && c.server.updated_at))}</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn secondary grow" data-cf-ok="${c.id}">${t('cf_keep_server')}</button>
        <button class="btn grow" data-cf-local="${c.id}">${t('cf_keep_local')}</button>
      </div></div>`).join('') : `<div class="muted">${t('cf_none')}</div>`) +
    `<button class="btn secondary block" id="btn-close-modal">${t('cancel')}</button>`);
}
async function syncResolveChoice(id, keepLocal) {
  const c = await db.conflicts.get(id); if (!c) return;
  await db.transaction('rw', db.table(c.table_name), db.conflicts, db.sync_queue, async () => {
    if (keepLocal && c.local) {
      const rec = { ...c.local, version: Math.max(c.local.version, c.server ? c.server.version : 0) + 1,
                    updated_at: new Date().toISOString(), sync_status: 'pending' };
      await db.table(c.table_name).put(rec); await enqueue(c.table_name, rec, 'update');
    }
    await db.conflicts.update(id, { resolved_at: new Date().toISOString(), resolution: keepLocal ? 'local_kept' : 'server_kept' });
  });
  syncSchedule(500); syncShowConflicts();
}

// ───────── Restore from an exported backup (JSON) ─────────
async function syncImportFile(file) {
  const shop = await getSetting('shop_id'); if (!shop) throw new Error('No shop');
  const obj = JSON.parse(await file.text());
  if (!obj || !obj.tables) throw new Error(t('import_bad'));
  let n = 0;
  for (const table of BUSINESS_TABLES) {
    const rows = (obj.tables[table] || []).filter(r => r && r.id && r.shop_id === shop);
    for (let i = 0; i < rows.length; i += 300) {
      const chunk = rows.slice(i, i + 300);
      await db.transaction('rw', db.table(table), db.sync_queue, async () => {
        const locals = await db.table(table).bulkGet(chunk.map(r => r.id));
        for (let k = 0; k < chunk.length; k++) {
          const l = locals[k], r = chunk[k];
          if (l && l.version >= r.version) continue;               // keep what is already here if it is as new or newer
          const rec = { ...r, sync_status: 'pending' };
          await db.table(table).put(rec); await enqueue(table, rec, 'insert'); n++;
        }
      });
    }
  }
  syncSchedule(500);
  return n;
}

// ── device.js
// Universal POS — device limit: one login ID works on the number of devices its plan allows (default 1).
// Enforced on the SERVER (see supabase/11_device_limit.sql). This file only registers the device and shows the messages.
// Super Admin is never limited.
const DVS = {
  dev_limit: ['یہ آئی ڈی پہلے ہی کسی اور ڈیوائس پر لاگ اِن ہے۔ نئی ڈیوائس پر چلانے کیلئے سپر ایڈمن سے رابطہ کریں۔', 'This ID is already logged in on another device. Contact the admin to move it to a new device.'],
  dev_revoked: ['یہ ڈیوائس اس آئی ڈی کیلئے بند کر دی گئی ہے۔ سپر ایڈمن سے رابطہ کریں۔', 'This device has been blocked for this ID. Contact the admin.'],
  dev_login_again: ['سیکیورٹی کے لیے دوبارہ لاگ اِن کریں۔', 'For security, please log in again.']
};
for (const k in DVS) { I18N.ur[k] = DVS[k][0]; I18N.en[k] = DVS[k][1]; }

function deviceName() {
  const ua = navigator.userAgent || '';
  const os = /Android/i.test(ua) ? 'Android' : /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : /Windows/i.test(ua) ? 'Windows' : /Mac/i.test(ua) ? 'Mac' : /Linux/i.test(ua) ? 'Linux' : 'Device';
  const br = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
  const model = (ua.match(/Android[^;]*;\s*([^;)]+)/) || [])[1];
  return [os, model && !/^Build/.test(model) ? model.trim() : '', br].filter(Boolean).join(' · ').slice(0, 80);
}

// Throws an Error (with .deviceBlocked = true) when the server refuses this device. Returns true otherwise.
async function deviceRegister(sb, session) {
  if (window.POS_DEMO || !session || session.admin) return true;
  const id = S.deviceId || (S.deviceId = await getDeviceId());
  const { error } = await sb.rpc('register_device', { p_shop: session.shop_id, p_device: id, p_name: deviceName() });
  if (!error) return true;
  const m = String(error.message || '') + ' ' + (error.code || '');
  if (/PGRST202|Could not find the function|schema cache/i.test(m)) return true;     // server not updated yet: don't lock anyone out
  const key = /device_limit/.test(m) ? 'dev_limit' : /device_revoked/.test(m) ? 'dev_revoked' : /device_login_again/.test(m) ? 'dev_login_again' : null;
  if (key) { const e = new Error(t(key)); e.deviceBlocked = true; throw e; }
  throw error;
}
function deviceErrText(m) { return /device_revoked/.test(m) ? t('dev_revoked') : t('dev_limit'); }

// Used when the server stops this device while the app is running (reset by Super Admin, or limit reached).
async function deviceKick(msg) {
  try { if (S.sb) await S.sb.auth.signOut(); } catch (e) {}
  await delSetting('session'); await delSetting('shop_id');
  S.session = null; S.cart = []; S.saleCust = null; S.pur = null;
  showLogin();
  const el = $('login-err'); if (el) { el.textContent = msg; el.hidden = false; }
  return { error: 'device_blocked' };
}

const PFS = {

  pf_bad: ['تصویر نہیں کھل سکی', 'Could not read the image'], pf_offline: ['تصویر فون میں محفوظ ہو گئی، انٹرنیٹ آنے پر سرور پر جائے گی', 'Saved on this phone; it will upload when online']
};
for (const k in PFS) { I18N.ur[k] = PFS[k][0]; I18N.en[k] = PFS[k][1]; }

const avKey = () => 'avatar_' + ((S.session && S.session.user_id) || 'demo');
async function avatarLoad() { S.avatar = S.session ? await getSetting(avKey(), '') : ''; }
const avatarHtml = (size = 24, fallback = 'store') => (S.avatar ? `<img src="${S.avatar}" alt="">` : ic(fallback, size));
function avatarRefreshUi() {
  const h = $('hdr-avatar'); if (h) h.innerHTML = avatarHtml(24);
  const a = $('set-avatar'); if (a) a.innerHTML = avatarHtml(30, 'user');
  const d = $('btn-avatar-del'); if (d) d.hidden = !S.avatar;
}

// Centre-crop to a square, 192px, JPEG. Keeps the result small (≈8–20 KB).
function avatarResize(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const n = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - n) / 2, sy = (img.naturalHeight - n) / 2;
        const c = document.createElement('canvas'); c.width = c.height = 192;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 192, 192); x.drawImage(img, sx, sy, n, n, 0, 0, 192, 192);
        let q = 0.8, out = c.toDataURL('image/jpeg', q);
        while (out.length > 60000 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        resolve(out);
      } catch (e) { reject(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
async function avatarSet(dataUrl) {
  S.avatar = dataUrl || '';
  await setSetting(avKey(), S.avatar); await setSetting(avKey() + '_dirty', true);
  avatarRefreshUi();
  const ok = await avatarPush();
  if (!window.POS_DEMO && !ok) toast(t('pf_offline'), 3500);
}
async function avatarPush() {
  if (window.POS_DEMO) return true;
  if (!(await getSetting(avKey() + '_dirty', false))) return true;
  if (!navigator.onLine || !S.session) return false;
  try {
    const { error } = await getSb().rpc('set_my_avatar', { p_shop: S.session.shop_id, p_avatar: S.avatar || '' });
    if (error) return false;
    await delSetting(avKey() + '_dirty'); return true;
  } catch (e) { return false; }
}
// Called from the sync routine: send a pending change, otherwise take the server's picture (e.g. after changing phone).
async function avatarPull(sb, shop) {
  if (window.POS_DEMO || !S.session) return;
  if (await getSetting(avKey() + '_dirty', false)) { await avatarPush(); return; }
  const { data, error } = await sb.from('shop_members').select('avatar').eq('shop_id', shop).eq('user_id', S.session.user_id).maybeSingle();
  if (error || !data) return;                           // column not created yet: keep the local picture
  const srv = data.avatar || '';
  if (srv !== (S.avatar || '')) { S.avatar = srv; await setSetting(avKey(), srv); avatarRefreshUi(); }
}

      'The Provider grants the Customer a non-exclusive, non-transferable, limited licence, for that shop only and only for the subscription period. The Customer will not copy, resell, rent, modify, or try to extract the source code of the app.'],
    ['پلان اور سبسکرپشن', 'Plan and subscription',

    ['فیس اور ادائیگی', 'Fees and payment',

    ['میعاد ختم ہونا اور معطلی', 'Expiry and suspension',

      'When the subscription expires or a shop is suspended, login is blocked from the next login. The Provider may suspend a shop or an account for non-payment, breach of this agreement or unlawful use. After suspension or expiry the data is kept for {retain} days; on renewal everything is restored.'],
    ['اکاؤنٹس اور ڈیوائسز', 'Accounts and devices',

      'Each login ID (mobile number) belongs to one person and must not be shared. An ID can run on the number of devices set by the plan (default: one device). If a device is lost or stolen, tell the Provider immediately; the Provider may block that device and, after verification, allow the ID on a new device, and may also allow a blocked device again. The Customer is responsible for all activity under its accounts.'],
    ['صارف کا ڈیٹا', 'Customer data',

    ['بل پر QR کوڈ', 'The QR code on bills',

      'The QR printed on a bill is for verification only, i.e. to check that a bill matches the shop’s records. It is not a way to pay or receive money and is not a verification by any government body (such as the FBR). The verification code is a simple way to spot alterations, not a digital signature. The Provider does not guarantee its legal standing.'],
    ['ٹیکس اور قانونی تعمیل', 'Tax and legal compliance',

    ['ضمانت سے انکار اور ذمہ داری کی حد', 'Disclaimer and limit of liability',

    ['قابلِ اطلاق قانون اور تنازعہ', 'Governing law and disputes',

// ───────── helpers (work in the app and on legal.html) ─────────
const lgEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lgFill = (txt, L) => txt.replace(/\{(\w+)\}/g, (m, k) => {
  if (k === 'app') return LEGAL_CFG.app;
  if (k === 'company' || k === 'contact' || k === 'city') return LEGAL_CFG[k + (L === 0 ? '_ur' : '_en')];
  return k in LEGAL_CFG ? LEGAL_CFG[k] : m;
});
// L: 0 = Urdu, 1 = English
function legalDocHtml(doc, L) {
  const body = doc.clauses.map((c, i) => `<div class="lgc"><h4>${i + 1}. ${lgEsc(lgFill(c[L], L))}</h4>${lgFill(c[2 + L], L).split('\n').map(p => `<p>${lgEsc(p)}</p>`).join('')}</div>`).join('');
  return `<div class="legal" dir="${L === 0 ? 'rtl' : 'ltr'}"><div class="muted">${L === 0 ? 'ورژن' : 'Version'} ${LEGAL_CFG.version} · ${LEGAL_CFG.date}</div>${body}</div>`;
}

const termsKey = () => 'terms_' + ((S.session && S.session.user_id) || 'demo');
function legalListHtml(acc) {
  const L = LANG === 'ur' ? 0 : 1;
  return LEGAL_DOCS.map(d => `<button class="btn secondary block" type="button" data-legal="${d.id}" style="margin-bottom:8px;justify-content:flex-start">${ic(d.icon, 18)} ${lgEsc(d[L === 0 ? 'ur' : 'en'])}</button>`).join('')
    + `<div class="muted">${t('lg_ver')} ${LEGAL_CFG.version}${acc ? ` · ${t('lg_accepted_on')}: ${lgEsc(fmtDate(acc.at))}` : ''}</div>`;
}
function openLegal(id, L) {
  const d = LEGAL_DOCS.find(x => x.id === id); if (!d) return;
  L = L == null ? (LANG === 'ur' ? 0 : 1) : L;
  openModal(`<h2>${lgEsc(d[L === 0 ? 'ur' : 'en'])}</h2>
    <div class="row" style="margin-bottom:8px"><button class="btn secondary sm" type="button" id="lg-lang">${L === 0 ? 'English' : 'اردو'}</button>
      <a class="btn secondary sm" href="legal.html#${d.id}" target="_blank" rel="noopener" style="margin-inline-start:6px">${L === 0 ? 'پرنٹ / PDF' : 'Print / PDF'}</a></div>
    ${legalDocHtml(d, L)}<div style="margin-top:12px"><button class="btn secondary block" data-close>${t('close')}</button></div>`);
  $('lg-lang').onclick = () => openLegal(id, 1 - L);
}
async function termsPush() {
  if (window.POS_DEMO || !S.session || S.session.admin || !navigator.onLine) return;
  const acc = await getSetting(termsKey(), null);
  if (!acc || !(await getSetting(termsKey() + '_dirty', false))) return;
  try {
    const { error } = await getSb().rpc('accept_terms', { p_shop: S.session.shop_id, p_version: acc.v, p_device: typeof deviceName === 'function' ? deviceName() : '' });
    if (!error || /PGRST202|Could not find the function/i.test(error.message || '')) await delSetting(termsKey() + '_dirty');
  } catch (e) {}
}
// Shown after login until this user accepts the current version. Super Admin is exempt.
async function termsGate() {
  if (window.POS_DEMO || !S.session || S.session.admin) return;
  const acc = await getSetting(termsKey(), null);
  if (acc && acc.v === LEGAL_CFG.version) { termsPush(); return; }
  let g = $('terms-gate'); if (g) g.remove();
  g = document.createElement('div'); g.id = 'terms-gate';
  g.innerHTML = `<div class="tg-card"><h2>${t('lg_accept_title')}</h2><p>${t('lg_accept_intro')}</p>
    ${LEGAL_DOCS.map(d => `<button class="btn secondary block" type="button" data-legal="${d.id}" style="margin-bottom:8px;justify-content:flex-start">${ic(d.icon, 18)} ${lgEsc(d[LANG === 'ur' ? 'ur' : 'en'])}</button>`).join('')}
    <label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" id="tg-chk" style="width:auto;min-height:0;margin-top:5px"><span>${t('lg_agree')}</span></label>
    <button class="btn block" id="tg-ok" disabled>${t('lg_accept_btn')}</button>
    <button class="btn secondary block" id="tg-out" style="margin-top:8px">${t('lg_logout')}</button></div>`;
  document.body.appendChild(g);
  $('tg-chk').onchange = e => { $('tg-ok').disabled = !e.target.checked; };
  $('tg-ok').onclick = async () => {
    await setSetting(termsKey(), { v: LEGAL_CFG.version, at: new Date().toISOString() }); await setSetting(termsKey() + '_dirty', true);
    g.remove(); termsPush(); if (S.tab === 'settings') renderSettings();
  };
  $('tg-out').onclick = async () => { g.remove(); doLogout(); };
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-legal]'); if (b && typeof S !== 'undefined') openLegal(b.dataset.legal);
});
