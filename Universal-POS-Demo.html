    const line = (i, qty) => ({ product_id: prods[i].id, product_name: prods[i].name, qty, unit_price: prods[i].sale_price, cost_price: prods[i].cost_price });
    const by = session.user_id;
    await saveSale({ customer_id: cust[0].id, paid: 1000, created_by: by }, [line(1, 1), line(2, 1), line(3, 1)]);   // 2510 bill, 1000 paid -> udhaar 1510
    await saveSale({ customer_id: cust[2].id, paid: 0, created_by: by }, [line(4, 2), line(0, 3)]);                // 3350 all udhaar
    await saveSale({ customer_id: cust[3].id, paid: 300, created_by: by }, [line(8, 1), line(7, 2), line(9, 1)]);  // 810 bill, 300 paid -> udhaar 510
    await addCustomerPayment(cust[1].id, 1000, 'receipt', 'پہلی قسط');
    await saveSale({ created_by: by }, [line(6, 2), line(11, 1), line(9, 1)]);                      // walk-in, paid in full (380)
    await saveSale({ created_by: by }, [line(5, 2), line(0, 1)]);                                                  // walk-in, paid in full
    const SUP = [['الفلاح ٹریڈرز', '03111234567', 0], ['نیشنل ڈسٹری بیوٹرز', '03221234567', 4000], ['رحمان کریانہ ہول سیل', '', 0]];
    const sup = [];
    for (const [name, phone, opening_balance] of SUP) sup.push(await saveSupplier({ name, phone, opening_balance }));
    const pl = (i, qty, cost) => ({ product_id: prods[i].id, product_name: prods[i].name, qty, unit_cost: cost });
    await savePurchase({ supplier_id: sup[0].id, paid: 10000, update_cost: true, created_by: by }, [pl(0, 50, 138), pl(10, 20, 280), pl(9, 40, 58)]);   // 14,820, paid 10,000 -> owes 4,820
    await savePurchase({ supplier_id: sup[1].id, paid: 5000, update_cost: true, created_by: by }, [pl(1, 10, 1520), pl(4, 5, 1380)]);                // 22,100, paid 5,000 -> owes 17,100
    await addSupplierPayment(sup[1].id, 2000, 'payment', 'پہلی قسط');
    await savePurchase({ paid: 1500, created_by: by }, [pl(6, 30, 48)]);                                                                               // no supplier, paid in full
    await setSetting('demo_seeded', true);
  }
  if (!(await getSetting('demo_seeded_exp'))) {
    const ago = d => new Date(Date.now() - d * 864e5).toISOString();
    for (const [category, amount, note, d] of [['rent', 35000, 'دکان کا کرایہ', 9], ['electricity', 8400, 'بجلی کا بل', 6], ['salary', 22000, 'ملازم کی تنخواہ', 4], ['transport', 1800, 'مال کا کرایہ', 2], ['food', 450, 'چائے', 0], ['repair', 2500, 'فریزر کی مرمت', 0]])
      await saveExpense({ category, amount, note, created_at: ago(d), created_by: session.user_id });
    await setSetting('demo_seeded_exp', true);
  }
  const r = document.createElement('div'); r.className = 'demo-ribbon'; r.textContent = t('demo_badge'); document.body.appendChild(r);
};

</script>
<script>
// ── customers.js
// Universal POS — Customers & credit (udhaar) screens.
// Loaded BEFORE app.js; only declares functions. It uses the globals S, $, t, esc, money, num, fmtDate, toast,
// openModal, closeModal (app.js) and the customer functions in db.js at call time.

const CUST_PAGE = 30;
let custLedger = [], custShown = 0;

const canManageCustomers = () => S.session && ['owner', 'manager'].includes(S.session.role);

// Balance chip: red = customer owes us, green = advance, grey = clear.
function balChip(bal) {
  if (bal > 0) return `<span class="bal owe">Rs ${money(bal)}</span>`;
  if (bal < 0) return `<span class="bal adv">${t('advance')} ${money(-bal)}</span>`;
  return `<span class="bal zero">${t('clear')}</span>`;
}

// Pakistani numbers: 03xx… → 923xx… for wa.me links. Returns '' when the number is not usable.
function waNumber(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '92' + d.slice(1);
  return d.length >= 11 ? d : '';
}

// ───────── List ─────────
async function renderCustomers(append = false) {
  const v = $('view-customers');
  if (!append) {
    const sum = await creditSummary(S.session.shop_id);
    v.innerHTML = `
      <div class="udcard"><div class="udic">${ic('wallet', 26)}</div>
        <div class="grow"><div class="muted">${t('total_udhaar')}</div>
          <div class="big">Rs ${money(sum.total)}</div>
          <div class="muted">${sum.count} ${t('owes_n')}</div></div></div>
      <div class="row" style="margin-bottom:10px">
        <input id="cust-search" class="grow" type="search" placeholder="${t('cust_search')}" autocomplete="off" value="${esc(S.custQuery || '')}">
        <button class="btn" id="btn-addcust" type="button">${ic('plus', 18)} ${t('add_customer')}</button>
      </div>
      <div id="cust-list"></div><div id="cust-more"></div>`;
  }
  const list = await listCustomers(S.session.shop_id, S.custQuery, S.custPage || 0, CUST_PAGE);
  const bals = await getCustomerBalances(S.session.shop_id, list.map(c => c.id));
  const html = list.map(c => `
    <div class="card custcard" data-cust="${c.id}">
      <div class="avatar sm">${ic('user', 20)}</div>
      <div class="grow"><b>${esc(c.name)}</b>${c.phone ? `<div class="muted" dir="ltr" style="text-align:start">${esc(c.phone)}</div>` : ''}</div>
      ${balChip(bals[c.id])}
    </div>`).join('');
  const box = $('cust-list');
  if (!box) return;
  if (!append) box.innerHTML = html || `<div class="muted" style="text-align:center;padding:24px">${t('no_customers')}</div>`;
  else box.insertAdjacentHTML('beforeend', html);
  $('cust-more').innerHTML = list.length === CUST_PAGE ? `<button class="btn secondary block" id="btn-morecust">${t('more')}</button>` : '';
}

// ───────── Detail + ledger ─────────
async function openCustomerDetail(id) {
  const c = await db.customers.get(id);
  if (!c || c.deleted_at) return;
  const shop = S.session.shop_id;
  const bal = await getCustomerBalance(shop, id);
  custLedger = (await getCustomerLedger(shop, id)).reverse();
  custShown = 25;
  const wa = waNumber(c.phone);
  const msg = t('remind_msg').replace('{name}', c.name).replace('{shop}', S.session.shop_name || '').replace('{amt}', money(bal));
  openModal(`
    <div class="row"><div class="avatar sm">${ic('user', 20)}</div>
      <div class="grow"><h2 style="margin:0">${esc(c.name)}</h2>
        ${c.phone ? `<div class="muted" dir="ltr" style="text-align:start">${esc(c.phone)}</div>` : ''}
        ${c.address ? `<div class="muted">${esc(c.address)}</div>` : ''}</div>
      <button class="iconbtn" type="button" data-editcust="${id}" aria-label="${t('edit_customer')}">${ic('edit', 20)}</button></div>
    <div class="balbox ${bal > 0 ? 'owe' : bal < 0 ? 'adv' : ''}"><span>${bal < 0 ? t('advance') : t('udhaar')}</span><b>Rs ${money(Math.abs(bal))}</b></div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn grow" type="button" data-pay="${id}|receipt">${ic('down', 18)} ${t('receive_payment')}</button>
      <button class="btn secondary grow" type="button" data-pay="${id}|charge">${ic('up', 18)} ${t('add_udhaar')}</button>
    </div>
    <div class="row" style="margin-bottom:8px">
      ${c.phone ? `<a class="btn secondary grow lnk" href="tel:${esc(c.phone)}">${ic('phone', 18)} ${t('call')}</a>` : ''}
      ${wa && bal > 0 ? `<a class="btn secondary grow lnk" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">${ic('chat', 18)} ${t('remind')}</a>` : ''}
    </div>
    <h3 style="margin:12px 0 4px">${ic('book', 18)} ${t('ledger')}</h3>
    <div id="ledger-box"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn secondary grow" type="button" data-close>${t('close')}</button>
      ${canManageCustomers() ? `<button class="btn danger" type="button" data-delcust="${id}" aria-label="${t('delete')}">${ic('trash', 18)}</button>` : ''}
    </div>`);
  renderLedger();
}

function renderLedger() {
  const box = $('ledger-box'); if (!box) return;
  if (!custLedger.length) { box.innerHTML = `<div class="muted" style="text-align:center;padding:16px">${t('no_ledger')}</div>`; return; }
  const icon = { opening: 'book', sale: 'receipt', receipt: 'down', charge: 'up', purchase: 'truck', payment: 'up' };
  box.innerHTML = custLedger.slice(0, custShown).map(r => {
    const isDoc = r.type === 'sale' || r.type === 'purchase';
    const label = isDoc ? `${t('l_' + r.type)} ${esc(r.ref || '')}` : t('l_' + r.type);
    const sub = isDoc ? `${t('total')} ${money(r.total)} · ${t(r.type === 'purchase' ? 'paid_now' : 'paid')} ${money(r.paid)}` : esc(r.note || '');
    return `<div class="lrow ${r.type}" ${r.type === 'sale' ? `data-sale="${r.id}"` : r.type === 'purchase' ? `data-pur="${r.id}"` : ''}>
      <span class="lic">${ic(icon[r.type], 18)}</span>
      <div class="grow"><div><b>${label}</b></div><div class="muted">${esc(fmtDate(r.at))}${sub ? ' · ' + sub : ''}</div></div>
      <div class="lamt"><b>${r.delta < 0 ? '−' : '+'}${money(Math.abs(r.delta))}</b><div class="muted">${t('running')}: ${money(r.running)}</div></div>
    </div>`;
  }).join('') + (custLedger.length > custShown ? `<button class="btn secondary block" type="button" id="btn-moreledger" style="margin-top:8px">${t('more')}</button>` : '');
}

// ───────── Add / edit customer ─────────
// onSaved(rec) is used by the checkout picker to select a customer that was just created.
function openCustomerForm(id, onSaved) {
  (async () => {
    const c = id ? await db.customers.get(id) : {};
    const canOpen = !id || canManageCustomers();
    openModal(`<h2>${id ? t('edit_customer') : t('add_customer')}</h2>
      <form id="cust-form">
        <label>${t('name')}</label><input name="name" required value="${esc(c.name)}">
        <label>${t('phone')}</label><input name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="03001234567" value="${esc(c.phone)}">
        <label>${t('address')}</label><input name="address" value="${esc(c.address)}">
        ${canOpen ? `<label>${t('opening_balance')}</label><input name="opening_balance" type="number" inputmode="decimal" step="any" value="${c.opening_balance || ''}">` : ''}
        <label>${t('note')}</label><input name="note" value="${esc(c.note)}">
        <div class="row" style="margin-top:14px">
          <button class="btn grow" type="submit">${t('save')}</button>
          <button class="btn secondary" type="button" data-close>${t('cancel')}</button>
        </div>
      </form>`);
    $('cust-form').onsubmit = async ev => {
      ev.preventDefault();
      const f = Object.fromEntries(new FormData(ev.target).entries());
      try {
        const rec = await saveCustomer({ ...(id ? { id } : {}), name: f.name, phone: f.phone, address: f.address, note: f.note,
          ...(canOpen ? { opening_balance: f.opening_balance } : {}) });
        toast(t('saved')); refreshStatus();
        if (onSaved) return onSaved(rec);
        closeModal(); S.custPage = 0;
        if (S.tab === 'customers') renderCustomers();
        if (id) openCustomerDetail(id);
      } catch (ex) { toast(ex.message || t('err_generic'), 4000); }
    };
  })();
}

// ───────── Receive payment / add credit ─────────
async function openPaymentForm(id, kind) {
  const c = await db.customers.get(id);
  const bal = await getCustomerBalance(S.session.shop_id, id);
  openModal(`<h2>${kind === 'receipt' ? t('receive_title') : t('charge_title')}: ${esc(c.name)}</h2>
    <div class="muted">${t('cust_balance_now')}: <b>Rs ${money(bal)}</b></div>
    <form id="pay-form">
      <label>${t('amount')}</label>
      <input name="amount" type="number" inputmode="decimal" step="any" min="0" required value="${kind === 'receipt' && bal > 0 ? bal : ''}">
      <label>${t('note')}</label><input name="note">
      <div class="row" style="margin-top:14px">
        <button class="btn grow" type="submit">${t('save')}</button>
        <button class="btn secondary" type="button" data-opencust="${id}">${t('cancel')}</button>
      </div>
    </form>`);
  $('pay-form').onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target).entries());
    if (!(num(f.amount) > 0)) return toast(t('bad_amount'));
    try {
      await addCustomerPayment(id, num(f.amount), kind, f.note);
      toast(t('saved')); refreshStatus();
      if (S.tab === 'customers') renderCustomers();
      openCustomerDetail(id);
    } catch (ex) { toast(ex.message || t('err_generic'), 4000); }
  };
}

async function deleteCustomer(id) {
  if (!confirm(t('confirm_delete_cust'))) return;
  try {
    await softDeleteCustomer(S.session.shop_id, id);
    closeModal(); S.custPage = 0; renderCustomers(); refreshStatus();
  } catch (ex) { toast(ex.message === 'BALANCE_NOT_ZERO' ? t('cannot_delete_bal') : (ex.message || t('err_generic')), 4000); }
}

// ───────── Customer picker for the checkout sheet ─────────
async function openCustomerPicker() {
  openModal(`<h2>${t('pick_customer')}</h2>
    <div class="row"><input id="pick-search" class="grow" type="search" placeholder="${t('cust_search')}" autocomplete="off">
      <button class="iconbtn green" id="pick-new" type="button" aria-label="${t('add_customer')}">${ic('plus', 22)}</button></div>
    <button class="btn secondary block" id="pick-walkin" type="button" style="margin-top:8px">${t('walk_in')}</button>
    <div id="pick-list" style="margin-top:8px"></div>
    <div style="margin-top:10px"><button class="btn secondary block" type="button" id="pick-back">${t('cancel')}</button></div>`);
  const load = async () => {
    const q = $('pick-search') ? $('pick-search').value : '';
    const list = await listCustomers(S.session.shop_id, q, 0, 40);
    const bals = await getCustomerBalances(S.session.shop_id, list.map(c => c.id));
    const box = $('pick-list'); if (!box) return;
    box.innerHTML = list.length ? list.map(c => `
      <div class="card custcard" data-pickid="${c.id}"><div class="avatar sm">${ic('user', 20)}</div>
        <div class="grow"><b>${esc(c.name)}</b>${c.phone ? `<div class="muted" dir="ltr" style="text-align:start">${esc(c.phone)}</div>` : ''}</div>
        ${balChip(bals[c.id])}</div>`).join('')
      : `<div class="muted" style="text-align:center;padding:16px">${t('no_customers')}</div>`;
  };
  let timer;
  $('pick-search').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 150); };
  $('pick-list').onclick = async ev => {
    const el = ev.target.closest('[data-pickid]'); if (!el) return;
    const c = await db.customers.get(el.dataset.pickid);
    S.saleCust = { id: c.id, name: c.name };
    openCheckout();
  };
  $('pick-walkin').onclick = () => { S.saleCust = null; openCheckout(); };
  $('pick-back').onclick = () => openCheckout();
  $('pick-new').onclick = () => openCustomerForm(null, rec => { S.saleCust = { id: rec.id, name: rec.name }; openCheckout(); });
  load();
}

</script>
<script>
// ── purchases.js
// Universal POS — Purchases & suppliers screens. Loaded BEFORE app.js (functions only).
// Reuses customers.js helpers (balChip, waNumber, renderLedger, custLedger) and the db.js supplier/purchase functions.

const SUP_PAGE = 30;
const canPurchase = () => S.session && ['owner', 'manager'].includes(S.session.role);
const newPur = () => ({ supplier: null, lines: [], paid: 0, paidManual: false, updateCost: true, q: '' });

// ───────── Main view: purchases list | suppliers ─────────
async function renderPurchases(append = false) {
  const v = $('view-purchases');
  const seg = S.purSeg || 'list';
  if (!append) {
    const sum = await payableSummary(S.session.shop_id);
    v.innerHTML = `
      <div class="seg"><button type="button" data-purseg="list" class="${seg === 'list' ? 'on' : ''}">${ic('truck', 18)} ${t('purchases')}</button>
        <button type="button" data-purseg="suppliers" class="${seg === 'suppliers' ? 'on' : ''}">${ic('users', 18)} ${t('suppliers')}</button></div>
      <div class="udcard pay"><div class="udic">${ic('wallet', 26)}</div>
        <div class="grow"><div class="muted">${t('total_payable')}</div><div class="big">Rs ${money(sum.total)}</div>
          <div class="muted">${sum.count} ${t('owed_n')}</div></div></div>
      ${seg === 'list'
        ? `<button class="btn block" id="btn-newpur" type="button" style="margin-bottom:10px">${ic('plus', 18)} ${t('new_purchase')}</button>`
        : `<div class="row" style="margin-bottom:10px"><input id="sup-search" class="grow" type="search" placeholder="${t('cust_search')}" autocomplete="off" value="${esc(S.supQuery || '')}">
            <button class="btn" id="btn-addsup" type="button">${ic('plus', 18)} ${t('add_supplier')}</button></div>`}
      <div id="pur-list"></div><div id="pur-more"></div>`;
  }
  const box = $('pur-list'); if (!box) return;
  if (seg === 'list') {
    const list = await listPurchases(S.session.shop_id, S.purPage || 0, SUP_PAGE);
    const smap = {};
    (await db.suppliers.bulkGet([...new Set(list.map(p => p.supplier_id).filter(Boolean))])).forEach(s => { if (s) smap[s.id] = s.name; });
    const html = list.map(p => `
      <div class="card" data-pur="${p.id}" style="cursor:pointer">
        <div class="row"><div class="grow"><b>${esc(p.ref_no)}</b><div class="muted">${esc(fmtDate(p.created_at))}</div></div>
          <div class="price">${money(p.total)}</div></div>
        ${p.supplier_id && smap[p.supplier_id] ? `<div class="muted">${ic('truck', 14)} ${esc(smap[p.supplier_id])}${p.paid < p.total ? ` · <span class="owe-t">${t('payable')}: ${money(p.total - p.paid)}</span>` : ''}</div>` : ''}
      </div>`).join('');
    if (!append) box.innerHTML = html || `<div class="muted" style="text-align:center;padding:24px">${t('no_purchases')}</div>`;
    else box.insertAdjacentHTML('beforeend', html);
    $('pur-more').innerHTML = list.length === SUP_PAGE ? `<button class="btn secondary block" id="btn-morepur">${t('more')}</button>` : '';
  } else {
    const list = await listSuppliers(S.session.shop_id, S.supQuery, S.supPage || 0, SUP_PAGE);
    const bals = await getSupplierBalances(S.session.shop_id, list.map(c => c.id));
    const html = list.map(c => `
      <div class="card custcard" data-sup="${c.id}"><div class="avatar sm">${ic('truck', 20)}</div>
        <div class="grow"><b>${esc(c.name)}</b>${c.phone ? `<div class="muted" dir="ltr" style="text-align:start">${esc(c.phone)}</div>` : ''}</div>
        ${balChip(bals[c.id])}</div>`).join('');
    if (!append) box.innerHTML = html || `<div class="muted" style="text-align:center;padding:24px">${t('no_suppliers')}</div>`;
    else box.insertAdjacentHTML('beforeend', html);
    $('pur-more').innerHTML = list.length === SUP_PAGE ? `<button class="btn secondary block" id="btn-moresup">${t('more')}</button>` : '';
  }
}

// ───────── Supplier detail / forms ─────────
async function openSupplierDetail(id) {
  const c = await db.suppliers.get(id);
  if (!c || c.deleted_at) return;
  const shop = S.session.shop_id;
  const bal = await getSupplierBalance(shop, id);
  custLedger = (await getSupplierLedger(shop, id)).reverse();
  custShown = 25;
  openModal(`
    <div class="row"><div class="avatar sm">${ic('truck', 20)}</div>
      <div class="grow"><h2 style="margin:0">${esc(c.name)}</h2>
        ${c.phone ? `<div class="muted" dir="ltr" style="text-align:start">${esc(c.phone)}</div>` : ''}
        ${c.address ? `<div class="muted">${esc(c.address)}</div>` : ''}</div>
      <button class="iconbtn" type="button" data-editsup="${id}" aria-label="${t('edit_supplier')}">${ic('edit', 20)}</button></div>
    <div class="balbox ${bal > 0 ? 'owe' : bal < 0 ? 'adv' : ''}"><span>${bal < 0 ? t('advance') : t('payable')}</span><b>Rs ${money(Math.abs(bal))}</b></div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn grow" type="button" data-suppay="${id}|payment">${ic('up', 18)} ${t('pay_supplier')}</button>
      <button class="btn secondary grow" type="button" data-suppay="${id}|charge">${ic('down', 18)} ${t('add_payable')}</button>
    </div>
    ${c.phone ? `<div class="row" style="margin-bottom:8px"><a class="btn secondary grow lnk" href="tel:${esc(c.phone)}">${ic('phone', 18)} ${t('call')}</a>
      ${waNumber(c.phone) ? `<a class="btn secondary grow lnk" target="_blank" rel="noopener" href="https://wa.me/${waNumber(c.phone)}">${ic('chat', 18)} WhatsApp</a>` : ''}</div>` : ''}
    <h3 style="margin:12px 0 4px">${ic('book', 18)} ${t('ledger')}</h3>
    <div id="ledger-box"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn secondary grow" type="button" data-close>${t('close')}</button>
      <button class="btn danger" type="button" data-delsup="${id}" aria-label="${t('delete')}">${ic('trash', 18)}</button>
    </div>`);
  renderLedger();
}

function openSupplierForm(id, onSaved) {
  (async () => {
    const c = id ? await db.suppliers.get(id) : {};
    openModal(`<h2>${id ? t('edit_supplier') : t('add_supplier')}</h2>
      <form id="sup-form">
        <label>${t('name')}</label><input name="name" required value="${esc(c.name)}">
        <label>${t('phone')}</label><input name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="03001234567" value="${esc(c.phone)}">
        <label>${t('address')}</label><input name="address" value="${esc(c.address)}">
        <label>${t('opening_balance')}</label><input name="opening_balance" type="number" inputmode="decimal" step="any" value="${c.opening_balance || ''}">
        <label>${t('note')}</label><input name="note" value="${esc(c.note)}">
        <div class="row" style="margin-top:14px"><button class="btn grow" type="submit">${t('save')}</button>
          <button class="btn secondary" type="button" data-close>${t('cancel')}</button></div>
      </form>`);
    $('sup-form').onsubmit = async ev => {
      ev.preventDefault();
      const f = Object.fromEntries(new FormData(ev.target).entries());
      try {
        const rec = await saveSupplier({ ...(id ? { id } : {}), ...f });
        toast(t('saved')); refreshStatus();

  rc_verify: ['بل کی تصدیق کیلئے اسکین کریں', 'Scan to verify this bill'], rc_verify_note: ['صرف تصدیق کیلئے — ادائیگی کیلئے نہیں', 'For verification only — not for payment'], rc_qr_show: ['بل پر تصدیقی QR کوڈ', 'Verification QR code on bill'], rc_code: ['کوڈ', 'Code'], rc_qr_locked: ['بل پر تصدیقی QR کوڈ پریمیم پلان میں دستیاب ہے۔ تجدید / اپ گریڈ کیلئے رابطہ کریں۔', 'Verification QR on bills is available on the Premium plan. Contact us to upgrade.']
};
for (const k in PRT) { I18N.ur[k] = PRT[k][0]; I18N.en[k] = PRT[k][1]; }

const iname = i => (LANG === 'ur' && i.name_ur ? i.name_ur : i.product_name);
const kv = (l, v, cls = '', plain = false) => `<div class="kv ${cls}"><span>${l}</span><b${plain ? '' : ' class="num"'}>${v}</b></div>`;

// ───────── Bill verification QR (verification only — it carries NO payment / receiving information) ─────────
// 53-bit string hash (cyrb53): a short tamper-check code printed under the QR so a bill can be matched against the shop's records.
function billHash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function billCode(sale) {
  const s = [S.session.shop_id, sale.id, sale.invoice_no, sale.created_at, round2(sale.total)].join('|');
  const c = billHash(s).toString(36).toUpperCase().padStart(10, '0').slice(-8);
  return c.slice(0, 4) + '-' + c.slice(4);
}
function billQrText(sale) {
  const d = new Date(sale.created_at), p2 = n => String(n).padStart(2, '0');
  const when = isNaN(d) ? '' : `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  return ['UNIVERSAL POS - BILL VERIFICATION', 'Shop: ' + String(S.session.shop_name || '').slice(0, 40), 'Bill: ' + sale.invoice_no, 'Date: ' + when,
    'Total: Rs ' + round2(sale.total), 'Code: ' + billCode(sale)].join('\n');
}
// The bill QR is a plan feature: the demo always has it; live shops get it only when their plan has bill_qr = true.
const planHasQr = () => !!window.POS_DEMO || !!(S.session && S.session.bill_qr === true);
function billQrHtml(sale) {
  if (!planHasQr() || S.cfg.receipt_qr === false) return '';
  try {
    return `<div class="qrbox">${qrSvg(billQrText(sale), { size: 120 })}<div class="qrcap">${t('rc_verify')}</div>
      <div class="qrcode num">${t('rc_code')}: ${billCode(sale)}</div><div class="qrnote">${t('rc_verify_note')}</div></div>`;
  } catch (e) { return ''; }   // never block printing a bill because of the QR
}

function rcHead(title, qr = '') {
  const c = S.cfg;
  const top = S.cfg.paper === 'a4' ? '' : qr, side = S.cfg.paper === 'a4' ? qr : '';
  return `<div class="hd">${top}<div class="hi"><div class="shopname">${esc(S.session.shop_name)}</div>
    ${c.receipt_header ? `<div class="sub">${esc(c.receipt_header)}</div>` : ''}${c.shop_address ? `<div class="sub">${esc(c.shop_address)}</div>` : ''}
    ${c.shop_phone ? `<div class="sub num">${esc(c.shop_phone)}</div>` : ''}${c.shop_tax_no ? `<div class="sub">${t('set_ntn')}: <span class="num">${esc(c.shop_tax_no)}</span></div>` : ''}</div>
    <div class="doc">${title}</div>${side}</div>`;
}

function receiptHtml(sale, items, cust) {
  const a4 = S.cfg.paper === 'a4', due = Math.max(0, round2(sale.total - sale.paid)), qtySum = round3(items.reduce((a, i) => a + i.qty, 0));
  const meta = kv(t('invoice'), esc(sale.invoice_no)) + kv(t('ex_date'), esc(fmtDate(sale.created_at)), '', true) + (cust ? `<div class="kv"><span>${t('customer')}</span><b>${esc(cust.name)}</b></div>` : '');
  const lines = a4
    ? `<table class="rt"><thead><tr><th>#</th><th>${t('rc_item')}</th><th>${t('rc_qty')}</th><th>${t('rc_price')}</th><th>${t('rc_amount')}</th></tr></thead><tbody>${items.map((i, k) =>
        `<tr><td class="num">${k + 1}</td><td>${esc(iname(i))}</td><td class="num">${i.qty}${i.unit_name ? ' ' + esc(i.unit_name) : ''}</td><td class="num">${money(i.unit_price)}</td><td class="num"><b>${money(i.line_total)}</b></td></tr>`).join('')}</tbody></table>`
    : items.map(i => `<div class="it"><div class="n">${esc(iname(i))}</div><b class="num">${money(i.line_total)}</b></div><div class="q num">${i.qty}${i.unit_name ? ' ' + esc(i.unit_name) : ''} × ${money(i.unit_price)}</div>`).join('');
  const sums = kv(t('subtotal'), money(sale.subtotal)) + (sale.discount ? kv(t('discount'), '−' + money(sale.discount)) : '') + (sale.tax ? kv(t('tax'), money(sale.tax)) : '');
  const pay = kv(t('paid'), money(sale.paid)) + (due > 0 ? kv(t('balance'), money(due), 'dueline') : sale.paid > sale.total ? kv(t('change'), money(sale.paid - sale.total)) : '')
    + (cust && cust.balance > 0 ? kv(t('cust_balance_now'), money(cust.balance), 'dueline') : '');
  return `<div class="rc ${a4 ? 'a4' : ''}">${rcHead(t('rc_sale_invoice'), billQrHtml(sale))}
    <hr class="sep"><div class="meta">${meta}</div><hr class="sep">${lines}${a4 ? '' : '<hr class="sep">'}
    <div class="sumbox">${sums}<div class="grand"><span>${t('total')}</span><span class="num">Rs ${money(sale.total)}</span></div>${pay}
      <div class="stampwrap"><span class="stamp ${due > 0 ? 'owe' : 'paid'}">${due > 0 ? t('rc_due') : t('rc_paid')}</span></div></div>
    <hr class="sep"><div class="sub c">${t('rc_items')}: <span class="num">${items.length}</span> · ${t('rc_qty')}: <span class="num">${qtySum}</span>${sale.discount ? ` · ${t('rc_saved')}: <span class="num">Rs ${money(sale.discount)}</span>` : ''}</div>
    <div class="thanks">${esc(S.cfg.receipt_footer || t('thanks'))}</div><div class="sub c pw">${t('rc_powered')}</div></div>`;
}
function receiptText(sale, items, cust) {
  return [`*${S.session.shop_name}*`, `${t('invoice')}: ${sale.invoice_no}`, fmtDate(sale.created_at), '',
    ...items.map(i => `${iname(i)}  ${i.qty}${i.unit_name ? ' ' + i.unit_name : ''} × ${money(i.unit_price)} = ${money(i.line_total)}`), '',
    `*${t('total')}: Rs ${money(sale.total)}*`, `${t('paid')}: Rs ${money(sale.paid)}`,
    ...(sale.paid < sale.total ? [`${t('balance')}: Rs ${money(sale.total - sale.paid)}`] : []), '', S.cfg.receipt_footer || t('thanks')].join('\n');
}

function reportPrintHtml(r, low, period) {
  const { from, to } = periodRange(period), dfmt = d => new Date(d).toLocaleDateString(LANG === 'ur' ? 'ur-PK' : 'en-GB', { dateStyle: 'medium' });
  const last = new Date(new Date(to) - 864e5), row = (l, v, b) => `<tr class="${b || ''}"><td>${l}</td><td class="num">Rs ${money(v)}</td></tr>`;
  return `<div class="rc a4">${rcHead(t('rc_report'))}<hr class="sep">
    <div class="meta">${kv(t('rc_period'), dfmt(from) + ' – ' + dfmt(last), '', true)}${kv(t('rc_printed'), fmtDate(new Date().toISOString()), '', true)}${kv(t('bills_n'), r.bills)}</div>
    <table class="rt">${row(t('rp_sales'), r.revenue)}${row('− ' + t('rp_cogs'), r.cogs)}${row(t('rp_gross'), r.gross, 'strong')}${row('− ' + t('mod_expenses'), r.expenses)}${row(t('rp_net'), r.net, 'strong grandrow')}</table>
    <table class="rt">${row(t('rp_credit_given'), r.credit)}${row(t('rp_received'), r.received)}${row(t('rp_purchases'), r.purchases)}</table>
    ${r.top.length ? `<div class="sec">${t('rp_top')}</div><table class="rt"><thead><tr><th>${t('rc_item')}</th><th>${t('rc_qty')}</th><th>${t('rc_amount')}</th></tr></thead><tbody>${r.top.map(([n, x]) => `<tr><td>${esc(n)}</td><td class="num">${x.qty}</td><td class="num">${money(x.rev)}</td></tr>`).join('')}</tbody></table>` : ''}
    ${low.length ? `<div class="sec">${t('rp_low')}</div><table class="rt"><tbody>${low.map(({ p, st }) => `<tr><td>${esc(LANG === 'ur' && p.name_ur ? p.name_ur : p.name)}</td><td class="num">${st} / ${p.min_stock}</td></tr>`).join('')}</tbody></table>` : ''}
    <div class="sub c pw">${t('rc_powered')}</div></div>`;
}

function doPrint(html, paper) {
  $('receipt-print').innerHTML = html;
  let st = $('print-page'); if (!st) { st = document.createElement('style'); st.id = 'print-page'; document.head.appendChild(st); }
  st.textContent = paper === 'a4' ? '@page{size:A4;margin:12mm}' : `@page{size:${paper || 58}mm auto;margin:2mm}`;
  document.documentElement.style.setProperty('--paper', paper === 'a4' ? '100%' : (paper || 58) + 'mm');
  document.body.classList.add('printing'); window.print();
  setTimeout(() => document.body.classList.remove('printing'), 500);
}

<script>
// ── verify.js
// Universal POS — "Check a bill": does a bill (QR code or bill number + code) really come from THIS shop's records?
// Free for every plan and every role. Works offline: it compares against the sales stored on this phone.
// The QR on a printed bill is made by print.js (billQrText / billCode). This file only reads it back.
const VFS = {
  vf_btn: ['بل چیک کریں', 'Check a bill'], vf_title: ['بل کی تصدیق', 'Verify a bill'],
  vf_scan: ['QR اسکین کریں', 'Scan QR'], vf_or: ['یا ہاتھ سے لکھیں', 'or type it'],
  vf_inv: ['بل نمبر', 'Bill number'], vf_code: ['تصدیقی کوڈ (QR کے نیچے)', 'Verification code (under the QR)'], vf_go: ['چیک کریں', 'Check'],
  vf_paste: ['QR کا پورا متن یہاں چپکائیں (اختیاری)', 'Paste the full QR text here (optional)'],
  vf_ok: ['✓ یہ بل ہماری دکان کا اصلی بل ہے', '✓ This is a genuine bill of our shop'],
  vf_ok_sub: ['بل نمبر، تاریخ، رقم اور کوڈ ہمارے ریکارڈ سے مل گئے۔', 'Bill number, date, amount and code match our records.'],
  vf_nocode: ['بل ہمارے ریکارڈ میں ملا، مگر کوڈ نہیں ملایا گیا', 'Bill found in our records, but the code was not checked'],
  vf_nocode_sub: ['مکمل تصدیق کیلئے بل پر چھپا کوڈ بھی لکھیں یا QR اسکین کریں۔', 'For full verification also enter the printed code or scan the QR.'],
  vf_bad: ['✗ کوڈ یا رقم ہمارے ریکارڈ سے نہیں ملتی', '✗ Code or amount does not match our records'],
  vf_bad_sub: ['بل نمبر موجود ہے مگر تفصیل مختلف ہے۔ بل تبدیل شدہ یا جعلی ہو سکتا ہے۔', 'The bill number exists but the details differ. The bill may be altered or fake.'],
  vf_none: ['✗ یہ بل ہمارے ریکارڈ میں نہیں ملا', '✗ This bill is not in our records'],
  vf_none_sub: ['ہو سکتا ہے یہ کسی اور دکان کا ہو، یا اس فون پر ابھی سنک نہ ہوا ہو (سنک کر کے دوبارہ دیکھیں)۔', 'It may belong to another shop, or this phone has not synced it yet (sync and try again).'],
  vf_other: ['✗ یہ بل ہماری دکان کا نہیں', '✗ This bill is not from our shop'],
  vf_other_sub: ['QR پر کسی اور دکان کا نام ہے۔', 'The QR names a different shop.'],
  vf_unread: ['QR کا متن سمجھ نہیں آیا', 'Could not read this QR'],
  vf_unread_sub: ['یہ ہماری ایپ کا تصدیقی QR نہیں لگتا۔', 'This does not look like a verification QR from this app.'],
  vf_void: ['⚠ یہ بل منسوخ (void) ہو چکا ہے', '⚠ This bill has been voided'],
  vf_open: ['بل کھولیں', 'Open bill'], vf_again: ['دوبارہ چیک کریں', 'Check another'],
  vf_note: ['صرف تصدیق کیلئے — اس سے کوئی ادائیگی یا وصولی نہیں ہوتی۔', 'For verification only — no payment or receipt happens here.'],
  vf_need: ['بل نمبر لکھیں یا QR اسکین کریں', 'Enter a bill number or scan the QR'],
  vf_date: ['تاریخ', 'Date'], vf_total: ['کل رقم', 'Total']
};
for (const k in VFS) { I18N.ur[k] = VFS[k][0]; I18N.en[k] = VFS[k][1]; }

// QR text -> { shop, invoice, date, total, code } or null when it is not our format.
function billQrParse(text) {
  const lines = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length || !/BILL VERIFICATION/i.test(lines[0])) return null;
  const f = {}; for (const l of lines.slice(1)) { const i = l.indexOf(':'); if (i > 0) f[l.slice(0, i).trim().toLowerCase()] = l.slice(i + 1).trim(); }
  if (!f.bill) return null;
  return { shop: f.shop || '', invoice: f.bill, date: f.date || '', total: (f.total || '').replace(/^Rs\s*/i, ''), code: (f.code || '').toUpperCase() };
}
const vfNorm = s => String(s || '').toLowerCase().replace(/\s+/g, '');

// Core check. `q` = { invoice, code?, total?, date?, shop? }. Returns { state, sale? }.
//   ok | nocode | bad | none | other
async function verifyBill(q) {
  const inv = String(q.invoice || '').trim();
  const sale = inv ? await db.sales.where('[shop_id+invoice_no]').equals([S.session.shop_id, inv]).filter(s => !s.deleted_at).first() : null;
  if (!sale) {
    const sameShop = !q.shop || vfNorm(q.shop) === vfNorm(String(S.session.shop_name || '').slice(0, 40));
    return { state: sameShop ? 'none' : 'other' };
  }
  const code = String(q.code || '').trim().toUpperCase();
  if (!code) return { state: 'nocode', sale };
  let good = code === billCode(sale);
  if (good && q.total !== undefined && q.total !== '' && Number(String(q.total).replace(/,/g, '')) !== round2(sale.total)) good = false;
  if (good && q.date) { const mine = billQrText(sale).split('\n').find(l => l.startsWith('Date: ')); if (mine && mine.slice(6) !== q.date) good = false; }
  return { state: good ? 'ok' : 'bad', sale };
}

function vfResultHtml(r) {
  const k = { ok: ['ok', 'vf_ok', 'vf_ok_sub'], nocode: ['warn', 'vf_nocode', 'vf_nocode_sub'], bad: ['bad', 'vf_bad', 'vf_bad_sub'],
    none: ['bad', 'vf_none', 'vf_none_sub'], other: ['bad', 'vf_other', 'vf_other_sub'], unread: ['bad', 'vf_unread', 'vf_unread_sub'] }[r.state];
  const s = r.sale;
  return `<div class="vres ${k[0]}"><b>${t(k[1])}</b><div>${t(k[2])}</div></div>
    ${s ? `<div class="card" style="margin-top:8px"><div class="row"><b dir="ltr">${esc(s.invoice_no)}</b><span class="grow"></span><span class="price">${money(s.total)}</span></div>
      <div class="muted">${t('vf_date')}: ${esc(fmtDate(s.created_at))}</div>${s.status === 'void' ? `<div class="warn" style="margin-top:6px">${t('vf_void')}</div>` : ''}</div>
      <button class="btn secondary block" id="vf-open" data-sale-id="${s.id}" style="margin-top:8px">${t('vf_open')}</button>` : ''}
    <button class="btn block" id="vf-again" style="margin-top:8px">${t('vf_again')}</button>
    <div class="muted" style="margin-top:8px;text-align:center">${t('vf_note')}</div>`;
}
function openVerify() {
  openModal(`<h2>${t('vf_title')}</h2><div id="vf-body">
    ${'BarcodeDetector' in window && navigator.mediaDevices ? `<button class="btn block" id="vf-scan">${ic('scan', 20)} ${t('vf_scan')}</button><div class="muted" style="text-align:center;margin:8px 0">${t('vf_or')}</div>` : ''}
    <label>${t('vf_inv')}</label><input id="vf-inv" dir="ltr" autocomplete="off" placeholder="INV-000123">
    <label>${t('vf_code')}</label><input id="vf-code" dir="ltr" autocomplete="off" placeholder="XXXX-XXXX" style="text-transform:uppercase">
    <label>${t('vf_paste')}</label><textarea id="vf-paste" dir="ltr" rows="3"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn secondary" data-close>${t('close')}</button><button class="btn grow" id="vf-go">${t('vf_go')}</button></div>
    <div class="muted" style="margin-top:8px;text-align:center">${t('vf_note')}</div></div>`);
  const show = async q => { $('vf-body').innerHTML = vfResultHtml(q ? await verifyBill(q) : { state: 'unread' });
    $('vf-again').onclick = () => openVerify();
    if ($('vf-open')) $('vf-open').onclick = () => { const id = $('vf-open').dataset.saleId; closeModal(); showReceipt(id); }; };
  if ($('vf-scan')) $('vf-scan').onclick = async () => {
    closeModal();
    openModal(`<h2>${t('vf_scan')}</h2><div class="scanwrap"><video id="scanvideo" playsinline muted></video><div class="scanframe"><i class="scanline"></i></div></div>
      <div style="margin-top:10px"><button class="btn secondary block" data-close>${t('cancel')}</button></div>`);
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = $('scanvideo'); v.srcObject = scanStream; await v.play();
      let det; try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = new BarcodeDetector(); }
      scanTimer = setInterval(async () => {
        try {
          const codes = await det.detect(v);
          if (codes.length) {
            const raw = codes[0].rawValue; stopScan(); closeModal();
            openVerify(); const p = billQrParse(raw); $('vf-body').innerHTML = ''; await show(p);
          }
        } catch (e) {}
      }, 300);
    } catch (e) { closeModal(); toast(t('scan_unsupported'), 3500); }
  };
  $('vf-go').onclick = async () => {
    const pasted = billQrParse($('vf-paste').value);
    const q = pasted || { invoice: $('vf-inv').value, code: $('vf-code').value };
    if (!String(q.invoice || '').trim()) return toast(t('vf_need'), 2500);
    await show(q);
  };
}

</script>
<script>
// ── expenses.js
// Universal POS — Expenses. Loaded before reports.js and app.js. Uses the existing `expenses` table (no schema change).
const EXP_CATS = ['rent', 'electricity', 'salary', 'transport', 'food', 'repair', 'other'];
const EXT = {
  ex_rent: ['کرایہ', 'Rent'], ex_electricity: ['بجلی/گیس/پانی', 'Utilities'], ex_salary: ['تنخواہ', 'Salary'], ex_transport: ['کرایہ بار/ٹرانسپورٹ', 'Transport'],
  ex_food: ['چائے/کھانا', 'Tea & food'], ex_repair: ['مرمت', 'Repairs'], ex_other: ['متفرق', 'Other'],
  ex_add: ['نیا خرچہ', 'New expense'], ex_edit: ['خرچے میں ترمیم', 'Edit expense'], ex_cat: ['قسم', 'Category'], ex_date: ['تاریخ', 'Date'], ex_none: ['اس مدت میں کوئی خرچہ نہیں', 'No expenses in this period'],
  ex_total: ['کل اخراجات', 'Total expenses'], ex_confirm_del: ['یہ خرچہ حذف کریں؟', 'Delete this expense?'],
  p_today: ['آج', 'Today'], p_week: ['7 دن', '7 days'], p_month: ['اس ماہ', 'This month']
};
for (const k in EXT) { I18N.ur[k] = EXT[k][0]; I18N.en[k] = EXT[k][1]; }

const canReports = () => S.session && ['owner', 'manager'].includes(S.session.role);

// today | week (last 7 days) | month (since the 1st) -> ISO range [from, to)
function periodRange(p) {
  const s = new Date(); s.setHours(0, 0, 0, 0);
  if (p === 'week') s.setDate(s.getDate() - 6); else if (p === 'month') s.setDate(1);
  const e = new Date(); e.setHours(0, 0, 0, 0); e.setDate(e.getDate() + 1);
  return { from: s.toISOString(), to: e.toISOString() };
}
async function listExpenses(shopId, from, to) {
  const rows = await db.expenses.where('[shop_id+created_at]').between([shopId, from], [shopId, to]).reverse().toArray();
  return rows.filter(e => !e.deleted_at);
}
async function saveExpense(data) {
  const amount = round2(Number(data.amount));
  if (!(amount > 0)) throw new Error(t('bad_amount'));
  if (!EXP_CATS.includes(data.category)) throw new Error('Invalid category');
  const fields = { category: data.category, amount, note: (data.note || '').trim() || null };
  return db.transaction('rw', db.expenses, db.sync_queue, db.app_settings, async () => {
    let rec;
    if (data.id) {
      const old = await db.expenses.get(data.id);
      if (!old) throw new Error('Not found');
      rec = { ...old, ...fields, version: old.version + 1, updated_at: new Date().toISOString(), sync_status: 'pending' };
      await db.expenses.put(rec); await enqueue('expenses', rec, 'update');
    } else {
      rec = await newRecord({ ...fields, deleted_at: null, ...(data.created_at ? { created_at: data.created_at } : {}), created_by: data.created_by || null });
      await db.expenses.add(rec); await enqueue('expenses', rec, 'insert');
    }
    return rec;
  });
}
async function softDeleteExpense(id) {
  return db.transaction('rw', db.expenses, db.sync_queue, async () => {
    const old = await db.expenses.get(id); if (!old) return;
    const rec = { ...old, deleted_at: new Date().toISOString(), version: old.version + 1, updated_at: new Date().toISOString(), sync_status: 'pending' };
    await db.expenses.put(rec); await enqueue('expenses', rec, 'update');
  });
}

      <div class="grow"><b>${t('ex_' + e.category)}</b><div class="muted">${esc(e.note || '')}${e.note ? ' · ' : ''}${esc(fmtDate(e.created_at))}</div></div><span class="bal owe">Rs ${money(e.amount)}</span></div>`).join('')
      || `<div class="muted" style="text-align:center;padding:24px">${t('ex_none')}</div>`}`;

async function openExpenseForm(id) {
  const e = id ? await db.expenses.get(id) : { category: 'other' };
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  openModal(`<h2>${id ? t('ex_edit') : t('ex_add')}</h2><form id="ex-form">
    <label>${t('ex_cat')}</label><select name="category">${EXP_CATS.map(c => `<option value="${c}" ${c === e.category ? 'selected' : ''}>${t('ex_' + c)}</option>`).join('')}</select>
    <label>${t('amount')}</label><input name="amount" type="number" inputmode="decimal" step="any" min="0" required value="${e.amount ?? ''}">
    <label>${t('note')}</label><input name="note" value="${esc(e.note)}">
    ${id ? '' : `<label>${t('ex_date')}</label><input name="date" type="date" max="${today}" value="${today}">`}
    <div class="row" style="margin-top:14px"><button class="btn grow" type="submit">${t('save')}</button><button class="btn secondary" type="button" data-close>${t('cancel')}</button>
      ${id ? `<button class="btn danger" type="button" data-ex="del|${id}">${ic('trash', 18)}</button>` : ''}</div></form>`);
  $('ex-form').onsubmit = async ev => {
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target).entries());
    try {
      const created_at = !id && f.date && f.date !== today ? new Date(f.date + 'T' + new Date().toTimeString().slice(0, 5)).toISOString() : undefined;
      await saveExpense({ ...(id ? { id } : { created_at, created_by: S.session.user_id }), category: f.category, amount: f.amount, note: f.note });
      closeModal(); toast(t('saved')); renderExpenses(); refreshStatus();

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-ex]'); if (!el) return;

<script>
// ── reports.js
// Universal POS — Reports (profit & loss, credit, top products, low stock). Read-only: everything is computed from local records.
const RPT = {
  rp_sales: ['کل فروخت', 'Total sales'], rp_cogs: ['مال کی لاگت', 'Cost of goods sold'], rp_gross: ['مجموعی منافع', 'Gross profit'], rp_net: ['خالص منافع', 'Net profit'],
  rp_credit_given: ['ادھار دیا گیا', 'Credit given'], rp_received: ['ادھار کی وصولی', 'Credit received'], rp_purchases: ['خریداری', 'Purchases'],
  rp_daily: ['روزانہ فروخت', 'Daily sales'], rp_top: ['زیادہ بکنے والی پروڈکٹس', 'Top products'], rp_low: ['کم اسٹاک', 'Low stock'], rp_none: ['اس مدت میں کوئی فروخت نہیں', 'No sales in this period'],
  rp_loss: ['نقصان', 'Loss'], rp_refunds: ['واپسی میں لوٹائی گئی رقم', 'Cash refunded to customers'], rp_sold: ['بکا', 'sold'], rp_cash_note: ['منافع = فروخت − مال کی لاگت − اخراجات', 'Profit = sales − cost of goods − expenses']
};
for (const k in RPT) { I18N.ur[k] = RPT[k][0]; I18N.en[k] = RPT[k][1]; }

async function computeReport(shopId, p) {
  const { from, to } = periodRange(p), rng = [[shopId, from], [shopId, to]];
  const allSales = await db.sales.where('[shop_id+created_at]').between(...rng).toArray();
  const refunds = allSales.reduce((a, s) => a + (s.refunded || 0), 0);   // cash handed back to customers (returns / cancelled bills)
  const sales = allSales.filter(s => s.status !== 'void');
  let revenue = 0, cogs = 0, credit = 0; const prod = {}, day = {};
  for (const s of sales) {
    revenue += s.total; credit += Math.max(0, s.total - s.paid);
    const k = new Date(s.created_at).toDateString(); day[k] = (day[k] || 0) + s.total;
    for (const i of await db.sale_items.where('[shop_id+sale_id]').equals([shopId, s.id]).toArray()) {
      cogs += i.qty * (i.cost_price || 0);
      const r = prod[i.product_name] || (prod[i.product_name] = { qty: 0, rev: 0 }); r.qty += i.qty; r.rev += i.line_total;
    }
  }
  const exps = await listExpenses(shopId, from, to);
  const purchases = (await db.purchases.where('[shop_id+created_at]').between(...rng).toArray()).filter(x => x.status !== 'void').reduce((a, x) => a + x.total, 0);
  const received = (await db.payments.where('[shop_id+created_at]').between(...rng).toArray()).filter(x => x.party_type === 'customer' && x.kind === 'receipt' && !x.voided).reduce((a, x) => a + x.amount, 0);
  const expenses = exps.reduce((a, e) => a + e.amount, 0);
  const days = [], d = new Date(from), end = new Date(to);
  for (; d < end; d.setDate(d.getDate() + 1)) days.push({ n: d.getDate(), v: day[d.toDateString()] || 0 });
  const top = Object.entries(prod).sort((a, b) => b[1].rev - a[1].rev).slice(0, 5);
  return { revenue: round2(revenue), cogs: round2(cogs), gross: round2(revenue - cogs), expenses: round2(expenses), net: round2(revenue - cogs - expenses),
    refunds: round2(refunds), credit: round2(credit), received: round2(received), purchases: round2(purchases), bills: sales.length, days, top };
}
async function lowStockList(shopId) {
  const all = await db.products.where('[shop_id+name]').between([shopId, ''], [shopId, '\uffff']).filter(p => !p.deleted_at && p.is_active !== false && p.min_stock > 0).toArray();
  const st = await getStocks(shopId, all.map(p => p.id));
  return all.filter(p => st[p.id] <= p.min_stock).map(p => ({ p, st: st[p.id] })).slice(0, 8);
}
async function renderReports() {
  S.rpPeriod = S.rpPeriod || 'today';
  const v = $('view-reports');
  if (!canReports()) { v.innerHTML = `<div class="muted" style="text-align:center;padding:24px">${t('owner_mgr_only')}</div>`; return; }
  const r = await computeReport(S.session.shop_id, S.rpPeriod), low = await lowStockList(S.session.shop_id);
  S.lastReport = { r, low };
  const row = (l, val, cls = '') => `<div class="${cls}"><span>${l}</span><span>Rs ${money(val)}</span></div>`, mx = Math.max(1, ...r.days.map(x => x.v));
  v.innerHTML = `
    <div class="seg">${['today', 'week', 'month'].map(p => `<button class="${S.rpPeriod === p ? 'on' : ''}" data-rp="per|${p}">${t('p_' + p)}</button>`).join('')}</div>
    <button class="btn secondary block" data-rp="print" style="margin-bottom:12px">${ic('print', 18)} ${t('rc_print_report')}</button>
    <div class="today"><div class="cal">${ic('chart', 24)}</div><div class="grow"><div class="muted">${t('rp_net')} · ${r.bills} ${t('bills_n')}</div>
      <div class="big" style="${r.net < 0 ? 'color:var(--err)' : ''}">${r.net < 0 ? t('rp_loss') + ' ' : ''}Rs ${money(Math.abs(r.net))}</div><div class="muted" style="font-size:12px">${t('rp_cash_note')}</div></div></div>
    <div class="card totals">${row(t('rp_sales'), r.revenue)}${row('− ' + t('rp_cogs'), r.cogs)}${row(t('rp_gross'), r.gross)}${row('− ' + t('mod_expenses'), r.expenses)}${row(t('rp_net'), r.net, r.net < 0 ? 'grand neg' : 'grand')}</div>
    <div class="card totals">${row(t('rp_credit_given'), r.credit)}${row(t('rp_received'), r.received)}${row(t('rp_purchases'), r.purchases)}${r.refunds > 0 ? row(t('rp_refunds'), r.refunds) : ''}</div>
    ${r.days.length > 1 ? `<div class="card"><div class="sa-sec">${t('rp_daily')}</div><div class="sa-bars">${r.days.map(d => `<div><i style="height:${Math.max(3, Math.round(d.v / mx * 80))}%"></i><span style="font-size:9px">${d.n}</span></div>`).join('')}</div></div>` : ''}
    <div class="card"><div class="sa-sec">${t('rp_top')}</div>${r.top.map(([n, x]) => `<div class="lrow"><div class="grow"><b>${esc(n)}</b><div class="muted">${x.qty} ${t('rp_sold')}</div></div><b>Rs ${money(x.rev)}</b></div>`).join('') || `<div class="muted">${t('rp_none')}</div>`}</div>
    ${low.length ? `<div class="card"><div class="sa-sec">${t('rp_low')}</div>${low.map(({ p, st }) => `<div class="lrow"><div class="grow"><b>${esc(LANG === 'ur' && p.name_ur ? p.name_ur : p.name)}</b></div><span class="bal owe">${st} / ${p.min_stock}</span></div>`).join('')}</div>` : ''}`;
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-rp]'); if (!el) return;
  const [a, x] = el.dataset.rp.split('|');
  if (a === 'per') { S.rpPeriod = x; renderReports(); }
  else if (a === 'print' && S.lastReport) doPrint(reportPrintHtml(S.lastReport.r, S.lastReport.low, S.rpPeriod), 'a4');
});

</script>

// ───────── Live adapter (Supabase) ─────────
// SAD stays the in-memory working copy the UI already uses. saFetch() fills it from the server; saPush() diffs it against the
// last-synced snapshot and writes only what changed. RLS (is_platform_admin) is the real gatekeeper; the client check is UX only.
const SA_LIVE = () => !window.POS_DEMO;
const SA_TABLES = { plans: 'plans', shops: 'shops', users: 'shop_members', payments: 'sub_payments', audit: 'audit_log', announcements: 'announcements' };
const SA_COLS = {
  plans: ['id', 'name', 'name_ur', 'price', 'max_users', 'max_products', 'bill_qr', 'barcodes', 'max_devices'],
  shops: ['id', 'name', 'owner_name', 'phone', 'city', 'plan_id', 'trial', 'suspended', 'suspend_reason', 'archived', 'created_at', 'expires_at', 'last_seen', 'bills_30d', 'sales_30d', 'notes'],
  users: ['id', 'user_id', 'shop_id', 'name', 'phone', 'role', 'active', 'created_at', 'last_login'],
  payments: ['id', 'shop_id', 'plan_id', 'amount', 'days', 'method', 'note', 'at'],
  audit: ['id', 'at', 'actor', 'action', 'target', 'detail'],
  announcements: ['id', 'text', 'active', 'at']
};
let SAB = null, saQ = Promise.resolve();
const saKey = (t, r) => JSON.stringify(SA_COLS[t].map(c => (r[c] === undefined ? null : r[c])));
const saPick = (t, r) => Object.fromEntries(SA_COLS[t].map(c => [c, r[c] === undefined ? null : r[c]]));
function saSnap() {
  SAB = {};
  for (const t of Object.keys(SA_COLS)) { SAB[t] = new Map(); for (const r of SAD[t]) SAB[t].set(r.id, { k: saKey(t, r), r: { ...r } }); }
  SAB.settings = JSON.stringify(SAD.settings);
}
async function saFetch() {
  const sb = getSb(), q = (t, o) => { let x = sb.from(SA_TABLES[t]).select('*'); if (o) x = x.order(o, { ascending: false }); return x; };
  const res = await Promise.all([q('plans'), q('shops', 'created_at'), q('users', 'created_at'), q('payments', 'at'), q('audit', 'at').limit(300), q('announcements', 'at'),
    sb.from('platform_settings').select('*').eq('id', 1).maybeSingle()]);
  const bad = res.find(r => r.error); if (bad) throw new Error(bad.error.message);
  const [plans, shops, users, payments, audit, announcements] = res.slice(0, 6).map(r => r.data || []);
  const st = res[6].data || {};
  SAD = { plans, shops, users, payments, audit, announcements,
    settings: { trial_days: st.trial_days ?? 14, default_plan: st.default_plan || 'standard', support_phone: st.support_phone || '' } };
  saSnap();
}
async function saFn(body) {
  const { data, error } = await getSb().functions.invoke('admin-users', { body });
  if (error) { let m = error.message; try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (e) {} throw new Error(m); }
  if (data && data.error) throw new Error(data.error);
  return data;
}
const saUp = async (t, rows) => { if (!rows.length) return; const { error } = await getSb().from(SA_TABLES[t]).upsert(rows); if (error) throw new Error(error.message); };
async function saPushNow() {
  if (!SA_LIVE() || !SAD || !SAB) return;
  const d = SAD, changed = t => d[t].filter(r => { const o = SAB[t].get(r.id); return !o || o.k !== saKey(t, r); });
  await saUp('plans', changed('plans').map(r => saPick('plans', r)));
  await saUp('shops', changed('shops').map(r => saPick('shops', r)));            // parents before users
  const sb = getSb();
  for (const u of d.users) {                                                      // users: auth account first (Edge Function)
    const o = SAB.users.get(u.id);
    if (!o) {
      let r;
      try { r = await saFn({ action: 'create', email: loginIdToEmail(u.phone), member_id: u.id, shop_id: u.shop_id, name: u.name, phone: u.phone, role: u.role, active: u.active, password: u._pw }); }
      catch (e) {                                   // a brand-new shop whose owner account failed must not stay behind as an empty shop
        if (!SAB.shops.has(u.shop_id)) { try { await sb.from('shops').delete().eq('id', u.shop_id); } catch (x) {} }
        throw e;
      }
      u.user_id = r.user_id; delete u._pw;
      if (!u.active) await saFn({ action: 'ban', user_id: u.user_id, banned: true });
    } else if (o.k !== saKey('users', u)) {
      if (o.r.phone !== u.phone) await saFn({ action: 'phone', user_id: u.user_id, phone: u.phone, email: loginIdToEmail(u.phone) });
      if (!!o.r.active !== !!u.active) await saFn({ action: 'ban', user_id: u.user_id, banned: !u.active });
      const { error } = await sb.from('shop_members').update({ name: u.name, phone: u.phone, role: u.role, shop_id: u.shop_id, active: u.active }).eq('id', u.id);
      if (error) throw new Error(error.message);
    }
  }
  for (const [id] of SAB.users) if (!d.users.some(u => u.id === id)) await saFn({ action: 'delete', member_id: id });
  await saUp('payments', changed('payments').map(r => saPick('payments', r)));
  await saUp('audit', changed('audit').map(r => saPick('audit', r)));
  await saUp('announcements', changed('announcements').map(r => saPick('announcements', r)));
  for (const [id] of SAB.announcements) if (!d.announcements.some(a => a.id === id)) { const { error } = await sb.from('announcements').delete().eq('id', id); if (error) throw new Error(error.message); }
  if (JSON.stringify(d.settings) !== SAB.settings) { const { error } = await sb.from('platform_settings').upsert({ id: 1, ...d.settings }); if (error) throw new Error(error.message); }
  saSnap();
}

async function saFail(e) {

function saMonths() {
  const out = [], now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1), key = d.getFullYear() * 12 + d.getMonth();
    out.push({ key, label: d.toLocaleDateString(LANG === 'ur' ? 'ur-PK' : 'en-GB', { month: 'short' }), total: 0 });
  }
  SAD.payments.forEach(p => { const d = new Date(p.at), k = d.getFullYear() * 12 + d.getMonth(), m = out.find(x => x.key === k); if (m) m.total += p.amount; });
  return out;
}
function saDash() {
  const d = SAD, live = d.shops.filter(s => !s.archived), st = { active: 0, trial: 0, expired: 0, suspended: 0 };
  live.forEach(s => st[shopState(s)]++);
  const mrr = live.filter(s => shopState(s) === 'active').reduce((a, s) => a + saPlan(s.plan_id).price, 0);
  const soon = live.filter(s => ['active', 'trial'].includes(shopState(s)) && saDays(s.expires_at) <= 7).sort((a, b) => (a.expires_at < b.expires_at ? -1 : 1));
  const mo = saMonths(), mx = Math.max(1, ...mo.map(m => m.total)), ann = saAnnouncement();
  return `
    <div class="today"><div class="cal">${ic('chart', 24)}</div><div class="grow"><div class="muted">${t('sa_mrr')}</div>
      <div class="big">Rs ${money(mrr)}</div><div class="muted">${live.length} ${t('sa_t_shops')} · ${d.users.length} ${t('sa_t_users')}</div></div></div>
    ${ann ? `<div class="warn" style="margin:0 0 12px;padding:6px 12px">${ic('bell', 16)} ${esc(ann)}</div>` : ''}
    <div class="sa-stats">${['active', 'trial', 'expired', 'suspended'].map(k => `<button class="mod" data-sa="stat|${k}"><span class="mi" style="font-size:24px;font-weight:800">${st[k]}</span>${t('sa_st_' + k)}</button>`).join('')}</div>
    <div class="card"><div class="sa-sec">${t('sa_expiring')}</div>
      ${soon.map(s => `<div class="lrow" style="cursor:pointer" data-sa="shop|${s.id}"><span class="lic">${ic('clock', 16)}</span><div class="grow"><b>${esc(s.name)}</b><div class="muted">${esc(saPlanName(saPlan(s.plan_id)))}</div></div>${stChip(s)}<span class="muted">${saExpTxt(s)}</span></div>`).join('') || `<div class="muted">${t('sa_none')}</div>`}</div>
    <div class="card"><div class="sa-sec">${t('sa_rev6')}</div>
      <div class="sa-bars">${mo.map(m => `<div><span>${m.total ? Math.round(m.total / 1000) + 'k' : ''}</span><i style="height:${Math.max(3, Math.round(m.total / mx * 78))}%"></i><span>${m.label}</span></div>`).join('')}</div></div>

}

  const f = $('sa-form'), calc = (priceChanged) => {
    const shop = d.shops.find(x => x.id === f.shop_id.value), m = +f.months.value, pl = saPlan(f.plan_id.value);

  };

  calc();
  f.onsubmit = ev => {
    ev.preventDefault();
    const shop = d.shops.find(x => x.id === f.shop_id.value), m = +f.months.value, amount = round2(num(f.amount.value));

  };
}

function saPlanForm(id) {

    <label>${t('sa_price')}</label><input name="price" type="number" inputmode="decimal" min="0" required value="${p.price}">
    <div class="row"><div class="grow"><label>${t('sa_max_users')}</label><input name="max_users" type="number" min="1" required value="${p.max_users}"></div>
      <div class="grow"><label>${t('sa_max_products')}</label><input name="max_products" type="number" min="0" required value="${p.max_products}"></div></div>

    saLog('plan_edit', p.name); saSave(); closeModal(); toast(t('saved')); saRender();
  };
}

// ───────── More: announcements / log / settings ─────────
function saMoreView() {
  const d = SAD, seg = `<div class="seg">${[['ann', 'sa_ann'], ['log', 'sa_log'], ['set', 'sa_settings'], ['help', 'sa_help']].map(([k, l]) => `<button class="${SAS.mseg === k ? 'on' : ''}" data-sa="mseg|${k}">${t(l)}</button>`).join('')}</div>`;
  if (SAS.mseg === 'help') return seg + helpHtml('superadmin') +
    `<h3 style="margin:16px 4px 8px">${t('owner')} / ${t('manager')} / ${t('cashier')}</h3>` + ['owner', 'manager', 'cashier'].map(r => `<div class="muted" style="margin:10px 4px 6px"><b>${HELP_ROLE_LABEL[r][LANG === 'ur' ? 0 : 1]}</b></div>${helpHtml(r, false)}`).join('');
  if (SAS.mseg === 'ann') return seg + `<button class="btn block" data-sa="annadd" style="margin-bottom:12px">${ic('plus', 18)} ${t('sa_ann_add')}</button>` +
    (d.announcements.map(a => `<div class="card"><div>${esc(a.text)}</div><div class="row" style="margin-top:8px"><span class="muted grow">${esc(fmtDate(a.at))}</span>
      <button class="btn ${a.active ? '' : 'secondary'} sm" data-sa="anntoggle|${a.id}">${a.active ? t('sa_ann_on') : t('sa_ann_off')}</button><button class="btn danger sm" data-sa="anndel|${a.id}" aria-label="${t('delete')}">${ic('trash', 14)}</button></div></div>`).join('') || `<div class="muted" style="text-align:center;padding:24px">${t('sa_ann_none')}</div>`);
  if (SAS.mseg === 'log') return seg + `<div class="card">${d.audit.slice(0, SAS.logN).map(saActRow).join('') || `<div class="muted">${t('sa_no_log')}</div>`}</div>` +
    (d.audit.length > SAS.logN ? `<button class="btn secondary block" data-sa="morelog">${t('more')}</button>` : '');
  return seg + `<div class="card"><label>${t('language')}</label><select id="sa-set-lang"><option value="ur" ${LANG === 'ur' ? 'selected' : ''}>اردو</option><option value="en" ${LANG === 'en' ? 'selected' : ''}>English</option></select>
      <label>${t('sa_set_trial')}</label><input id="sa-set-trial" type="number" min="0" inputmode="numeric" value="${d.settings.trial_days}">
      <label>${t('sa_set_plan')}</label><select id="sa-set-plan">${d.plans.map(p => `<option value="${p.id}" ${p.id === d.settings.default_plan ? 'selected' : ''}>${esc(saPlanName(p))}</option>`).join('')}</select>
      <label>${t('sa_set_phone')}</label><input id="sa-set-phone" inputmode="tel" dir="ltr" value="${esc(d.settings.support_phone)}"></div>
    <button class="btn secondary block" data-sa="export" style="margin-bottom:10px">${ic('download', 18)} ${t('sa_export')}</button>

}
function saAnnForm() {
  openModal(`<h2>${t('sa_ann_add')}</h2><form id="sa-form"><label>${t('sa_ann_text')}</label><input name="text" required maxlength="160">
    <div class="row" style="margin-top:14px"><button class="btn grow" type="submit">${t('save')}</button><button class="btn secondary" type="button" data-close>${t('cancel')}</button></div></form>`);
  $('sa-form').onsubmit = ev => {
    ev.preventDefault();
    const txt = new FormData(ev.target).get('text').trim(); if (!txt) return;
    SAD.announcements.forEach(a => { a.active = false; });   // one live announcement at a time
    SAD.announcements.unshift({ id: uuid(), text: txt, active: true, at: saIso(0) });
    saLog('ann_new', txt.slice(0, 40)); saSave(); closeModal(); toast(t('saved')); saRender();
  };
}

// ───────── Actions (data-sa="name|arg") ─────────
const SA_ACT = {
  tab: k => { SAS.tab = k; saRender(); },
  lang: async () => { await saveCfg('lang', LANG === 'ur' ? 'en' : 'ur'); setLang(S.cfg.lang); applyStaticText(); saRender(); },
  exit: () => exitSuperAdmin(),
  stat: k => { SAS.tab = 'shops'; SAS.filter = k; SAS.q = ''; saRender(); },
  filter: k => { SAS.filter = k; saRender(); },
  shop: id => saShopDetail(id), shopnew: () => saShopForm(null), shopedit: id => saShopForm(id), renew: id => saRenewForm(id), payadd: () => saRenewForm(null),
  toggle: id => {
    const s = SAD.shops.find(x => x.id === id);
    if (s.suspended) { if (!confirm(t('sa_confirm_activate'))) return; s.suspended = false; s.suspend_reason = ''; saLog('shop_activate', s.name); }
    else { const r = prompt(t('sa_reason'), ''); if (r === null) return; s.suspended = true; s.suspend_reason = r.trim(); saLog('shop_suspend', s.name, s.suspend_reason); }
    saSave(); closeModal(); toast(t('saved')); saRender();
  },
  archive: id => {
    const s = SAD.shops.find(x => x.id === id);
    if (!s.archived && !confirm(t('sa_confirm_archive'))) return;
    s.archived = !s.archived; saLog(s.archived ? 'shop_archive' : 'shop_restore', s.name); saSave(); closeModal(); toast(t('saved')); saRender();
  },
  useradd: sid => saUserForm(null, sid), useredit: id => saUserForm(id),
  mkowner: sid => {                       // shop exists but has no login: create the owner from the shop's own owner name + phone
    const s = SAD.shops.find(x => x.id === sid); if (!s) return;
    const phone = saPhone(s.phone);
    try { loginIdToEmail(phone); } catch (e) { return toast(t('bad_phone'), 4000); }
    if (SAD.users.some(x => saPhone(x.phone) === phone)) return toast(t('sa_phone_used'), 4000);
    const pw = saPass(), nu = { id: uuid(), shop_id: sid, name: s.owner_name, phone, role: 'owner', active: true, created_at: saIso(0), last_login: null, _pw: pw };
    SAD.users.push(nu); saLog('user_new', nu.name, s.name);
    saCommit().then(ok => { if (ok) { saRender(); saShowCreds(nu.name, phone, pw); } });
  },
  userdel: id => {
    const u = SAD.users.find(x => x.id === id);
    if (saOnlyOwner(u)) return toast(t('sa_last_owner'), 4000);
    if (!confirm(t('sa_confirm_deluser'))) return;
    SAD.users = SAD.users.filter(x => x.id !== id); saLog('user_del', u.name, saShopName(u.shop_id)); saSave(); closeModal(); toast(t('saved')); saRender();
  },
  resetpw: async id => {
    const u = SAD.users.find(x => x.id === id);
    if (!confirm(t('sa_confirm_reset'))) return;
    const pw = saPass();
    if (SA_LIVE()) { try { await saFn({ action: 'reset', user_id: u.user_id, password: pw, email: loginIdToEmail(u.phone) }); } catch (e) { return toast(e.message || t('err_generic'), 5000); } }
    saLog('pw_reset', u.name, saShopName(u.shop_id)); saSave(); saShowCreds(u.name, u.phone, pw);
  },
  devreset: async (id, dev) => {
    const u = SAD.users.find(x => x.id === id); if (!u || !u.user_id) return;
    if (!confirm(t('sa_dev_confirm'))) return;
    try { const { error } = await getSb().rpc('admin_reset_devices', { p_user: u.user_id, p_shop: u.shop_id, p_device: dev || null }); if (error) throw error; }
    catch (e) { return toast(e.message || t('err_generic'), 5000); }
    saLog('dev_reset', u.name, saShopName(u.shop_id)); saSave(); toast(t('saved')); saLoadDevices(u);
  },
  devallow: async (id, dev) => {
    const u = SAD.users.find(x => x.id === id); if (!u || !dev) return;
    try { const { error } = await getSb().rpc('admin_allow_device', { p_device: dev }); if (error) throw error; }
    catch (e) { return toast(/device_limit/.test(e.message || '') ? t('sa_dev_full') : (e.message || t('err_generic')), 5000); }
    saLog('dev_allow', u.name, saShopName(u.shop_id)); saSave(); toast(t('saved')); saLoadDevices(u);
  },
  copy: pw => { try { navigator.clipboard.writeText(pw); toast(t('sa_copied')); } catch (e) { toast(pw, 5000); } },
  bseg: k => { SAS.bseg = k; saRender(); }, planedit: id => saPlanForm(id),
  mseg: k => { SAS.mseg = k; saRender(); }, morelog: () => { SAS.logN += 30; saRender(); },
  annadd: () => saAnnForm(),
  anntoggle: id => { const a = SAD.announcements.find(x => x.id === id); if (!a.active) SAD.announcements.forEach(x => { x.active = false; }); a.active = !a.active; saSave(); saRender(); },
  anndel: id => { SAD.announcements = SAD.announcements.filter(x => x.id !== id); saSave(); saRender(); },
  export: () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(SAD, null, 1)], { type: 'application/json' }));
    a.download = `platform-export-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  resetsa: () => { if (!confirm(t('sa_reset_demo_confirm'))) return; SAD = saSeed(); saSave(); toast(t('saved')); saRender(); }
};
document.addEventListener('click', ev => {
  if (ev.target.closest('#btn-sa-open')) return showSuperAdmin();
  const el = ev.target.closest('[data-sa]'); if (!el) return;
  const [a, x, y] = el.dataset.sa.split('|');
  if (SA_ACT[a]) { saLoad(); SA_ACT[a](x, y, el); }
});
let saTimer;
document.addEventListener('input', ev => {
  const id = ev.target.id;
  if (id === 'sa-q') { clearTimeout(saTimer); saTimer = setTimeout(() => { SAS.q = ev.target.value; saShopsList(); }, 150); }
  else if (id === 'sa-uq') { clearTimeout(saTimer); saTimer = setTimeout(() => { SAS.uq = ev.target.value; saUsersList(); }, 150); }
});
document.addEventListener('change', async ev => {
  const id = ev.target.id; if (!id || !id.startsWith('sa-set-')) return;
  const v = ev.target.value;
  if (id === 'sa-set-lang') { await saveCfg('lang', v); setLang(v); applyStaticText(); return saRender(); }
  if (id === 'sa-set-trial') SAD.settings.trial_days = Math.max(0, Math.round(num(v)));
  if (id === 'sa-set-plan') SAD.settings.default_plan = v;
  if (id === 'sa-set-phone') SAD.settings.support_phone = saPhone(v);
  saLog('settings', id.replace('sa-set-', '')); saSave(); toast(t('saved'));
});
if (window.POS_DEMO_RESET) { const r0 = window.POS_DEMO_RESET; window.POS_DEMO_RESET = () => { try { localStorage.removeItem(SAK); } catch (e) {} r0(); }; }

</script>

// ───────── Data API (live = Supabase RPC/tables, demo = localStorage) ─────────
function ctErr(e) {
  const m = String((e && e.message) || e || '');
  if (/rate_limit/.test(m)) return new Error(t('ct_rate'));
  if (/support_tickets|support_send|support_reply|support_mark_read|schema cache|does not exist/i.test(m)) return new Error(t('ct_not_ready'));
  return new Error(m || t('err_generic'));
}
const ctApi = {
  async mine() {
    if (!ctLive()) return ctDemo().tickets.filter(x => x.shop_id === S.session.shop_id).sort(ctByNew);
    const { data, error } = await getSb().from('support_tickets').select('*').eq('user_id', S.session.user_id).order('updated_at', { ascending: false }).limit(50);
    if (error) throw ctErr(error); return data || [];
  },
  async thread(id) {
    if (!ctLive()) return ctDemo().messages.filter(m => m.ticket_id === id).sort((a, b) => (a.at < b.at ? -1 : 1));
    const { data, error } = await getSb().from('support_messages').select('*').eq('ticket_id', id).order('at', { ascending: true });
    if (error) throw ctErr(error); return data || [];
  },
  async send(o) {            // o: { ticket|null, kind, topic, subject, body }
    const body = o.body.trim();
    if (!ctLive()) {
      const d = ctDemo(), now = new Date().toISOString(), s = S.session;
      let tk = o.ticket && d.tickets.find(x => x.id === o.ticket);
      if (!tk) { tk = { id: uuid(), shop_id: s.shop_id, user_id: s.user_id, user_name: s.user_name || 'Demo', shop_name: s.shop_name, phone: '', kind: o.kind, topic: o.topic, subject: o.subject.trim(), meta: ctMeta(), status: 'open', admin_unread: true, user_unread: false, created_at: now, updated_at: now }; d.tickets.push(tk); }
      Object.assign(tk, { status: 'open', admin_unread: true, user_unread: false, updated_at: now });
      d.messages.push({ id: uuid(), ticket_id: tk.id, sender: 'user', sender_name: s.user_name || '', body, at: now });
      ctDemoSave(d); return tk.id;
    }
    const { data, error } = await getSb().rpc('support_send', { p_shop: S.session.shop_id, p_ticket: o.ticket || null, p_kind: o.kind || 'problem', p_topic: o.topic || 'other', p_subject: o.subject || '', p_body: body, p_meta: ctMeta() });
    if (error) throw ctErr(error); return data;
  },
  async read(id) {
    if (!ctLive()) { const d = ctDemo(), tk = d.tickets.find(x => x.id === id); if (tk) { tk.user_unread = false; ctDemoSave(d); } return; }
    await getSb().rpc('support_mark_read', { p_ticket: id });
  },
  async all() {
    if (!ctLive()) return ctDemo().tickets.slice().sort(ctByNew);
    const { data, error } = await getSb().from('support_tickets').select('*').order('updated_at', { ascending: false }).limit(200);
    if (error) throw ctErr(error); return data || [];
  },
  async reply(id, body, close) {
    if (!ctLive()) {
      const d = ctDemo(), tk = d.tickets.find(x => x.id === id), now = new Date().toISOString(); if (!tk) return;
      d.messages.push({ id: uuid(), ticket_id: id, sender: 'admin', sender_name: 'Support', body: body.trim(), at: now });
      Object.assign(tk, { status: close ? 'closed' : 'answered', user_unread: true, admin_unread: false, updated_at: now }); ctDemoSave(d); return;
    }
    const { error } = await getSb().rpc('support_reply', { p_ticket: id, p_body: body.trim(), p_close: !!close });
    if (error) throw ctErr(error);
  },
  async setStatus(id, status) {
    if (!ctLive()) { const d = ctDemo(), tk = d.tickets.find(x => x.id === id); if (tk) { tk.status = status; ctDemoSave(d); } return; }
    const { error } = await getSb().from('support_tickets').update({ status }).eq('id', id); if (error) throw ctErr(error);
  },
  async adminRead(id) {
    if (!ctLive()) { const d = ctDemo(), tk = d.tickets.find(x => x.id === id); if (tk) { tk.admin_unread = false; ctDemoSave(d); } return; }
    await getSb().from('support_tickets').update({ admin_unread: false }).eq('id', id);
  },
  async counts() {
    const out = { user: 0, admin: 0 };
    if (!ctLive()) { const d = ctDemo(); out.user = d.tickets.filter(x => x.user_unread && x.shop_id === S.session.shop_id).length; out.admin = d.tickets.filter(x => x.admin_unread).length; return out; }
    const sb = getSb();
    if (S.session) { const r = await sb.from('support_tickets').select('id', { count: 'exact', head: true }).eq('user_id', S.session.user_id).eq('user_unread', true); if (!r.error) out.user = r.count || 0; }
    if (ctIsAdmin()) { const r = await sb.from('support_tickets').select('id', { count: 'exact', head: true }).eq('admin_unread', true); if (!r.error) out.admin = r.count || 0; }
    return out;
  },
  async phone() {
    if (CT.phone != null) return CT.phone;
    if (!ctLive()) return (CT.phone = (typeof SAD !== 'undefined' && SAD && SAD.settings && SAD.settings.support_phone) || '03001234567');
    try { const { data } = await getSb().from('platform_settings').select('support_phone').eq('id', 1).maybeSingle(); CT.phone = (data && data.support_phone) || ''; } catch (e) { CT.phone = ''; }
    return CT.phone;
  }
};

function ctBadge(el, n, abs) {

async function ctPoll() {

function ctStart() {

    if (CT.ch || !(S.session || S.isAdmin)) return;
