<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f7b3f">
  <title>Universal POS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot" style="padding:40px;text-align:center;color:#0f7b3f">…</div>

  <section id="login" hidden>
    <h1 id="login-title"></h1>
    <form id="login-form" autocomplete="on">
      <label id="lbl-email" for="in-email"></label>
      <input id="in-email" type="email" name="email" autocomplete="username" required dir="ltr">
      <label id="lbl-pass" for="in-pass"></label>
      <input id="in-pass" type="password" name="password" autocomplete="current-password" required dir="ltr">
      <div style="margin-top:16px"><button class="btn block" id="btn-login" type="submit"></button></div>
      <div class="errtext" id="login-err" hidden></div>
    </form>
    <div id="shop-choice" hidden></div>
  </section>

  <div id="app" hidden>
    <header class="top">
      <div class="shop" id="hdr-shop"></div>
      <span class="chip" id="chip-net"><span class="dot" id="net-dot"></span><span id="net-text"></span></span>
      <span class="chip pend" id="chip-pend" hidden></span>
      <span class="chip fail" id="chip-fail" hidden></span>
      <button class="langbtn" id="btn-lang" type="button">EN</button>
    </header>
    <div id="syncnote"></div>
    <main>
      <section id="view-bill"></section>
      <section id="view-products" hidden></section>
      <section id="view-sales" hidden></section>
      <section id="view-settings" hidden></section>
    </main>
    <nav class="bottom" id="nav"></nav>
  </div>

  <div id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" hidden></div>
  <div id="receipt-print"></div>

  <!-- Libraries: the service worker caches these on first load so the app works offline afterwards. -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
